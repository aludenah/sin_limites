const I=[
{t:'¿Qué es la Historia?',s:'Concepto, objeto y finalidad',k:'La Historia estudia el pasado humano para comprender el presente y explicar los cambios de las sociedades.',p:'La Historia es una ciencia social que estudia a las sociedades humanas a través del tiempo. No consiste en memorizar fechas: analiza procesos, cambios, permanencias, causas y consecuencias.',b:['Su objeto de estudio es la actividad humana en sociedad.','Relaciona hechos con un tiempo y un espacio determinados.','Investiga dimensiones políticas, económicas, sociales, culturales y tecnológicas.','Ayuda a comprender cómo el pasado influye en nuestro presente.'],e:'Si una ciudad antigua fue abandonada, el historiador pregunta qué ocurrió, por qué ocurrió, cómo afectó a sus habitantes y qué evidencias quedaron.',q:[['¿Qué estudia principalmente la Historia?',['Las sociedades humanas a través del tiempo','Solo las fechas importantes','Únicamente las guerras'],0],['¿Cuál es una finalidad de la Historia?',['Comprender procesos del pasado','Memorizar listas sin explicarlas','Reemplazar a la Geografía'],0]]},
{t:'La Historia como ciencia',s:'Método, evidencia e interpretación',k:'Una explicación histórica debe sostenerse en fuentes analizadas y contrastadas, no solo en opiniones.',p:'La Historia se considera ciencia porque construye conocimiento mediante preguntas, evidencias, procedimientos sistemáticos y explicaciones argumentadas. Sus conclusiones pueden revisarse cuando aparecen nuevas fuentes.',b:['Problematización: formula una pregunta de investigación.','Heurística: localiza y selecciona fuentes útiles.','Crítica de fuentes: analiza autenticidad, procedencia, contexto e intención.','Interpretación: relaciona datos y construye explicaciones fundamentadas.'],e:'Para estudiar una civilización antigua se pueden contrastar manuscritos, objetos arqueológicos, mapas, monedas y testimonios antes de llegar a una conclusión.',q:[['¿Qué demuestra mejor el carácter científico de la Historia?',['Usa métodos y evidencias contrastables','Sus explicaciones nunca pueden cambiar','Depende solo de la memoria'],0],['¿Qué hace la crítica de fuentes?',['Evalúa autenticidad, procedencia e intención','Elimina todas las fuentes antiguas','Memoriza fechas'],0]]},
{t:'Las fuentes históricas',s:'Evidencias para reconstruir el pasado',k:'Las fuentes no “hablan solas”: deben contextualizarse, contrastarse e interpretarse.',p:'Las fuentes históricas son testimonios o evidencias que permiten conocer el pasado. Pueden ser primarias, si proceden directamente de la época estudiada, o secundarias, si fueron elaboradas después a partir del análisis de otras fuentes.',b:['Primarias: cartas, leyes, monedas, cerámicas, fotografías antiguas y herramientas.','Secundarias: libros de historia, artículos académicos, documentales y enciclopedias.','También pueden clasificarse como escritas, materiales, orales, iconográficas o audiovisuales.','Su utilidad depende de la pregunta que se desea responder.'],e:'Una carta escrita durante una guerra es una fuente primaria; un libro actual que analiza esa carta es una fuente secundaria.',q:[['¿Cuál es una fuente primaria?',['Una moneda antigua','Un manual escolar actual','Un documental moderno'],0],['¿Qué diferencia básica existe entre fuente primaria y secundaria?',['La primaria procede de la época; la secundaria la analiza después','La secundaria siempre es más antigua','No existe diferencia'],0]]},
{t:'Ciencias auxiliares de la Historia',s:'Disciplinas que amplían la investigación',k:'La Historia trabaja con otras disciplinas para comprender mejor diferentes tipos de evidencias.',p:'La investigación histórica se enriquece con ciencias auxiliares que aportan métodos y conocimientos especializados para estudiar objetos, espacios, culturas, escrituras y monedas.',b:['Arqueología: estudia restos materiales de sociedades del pasado.','Geografía: relaciona los hechos con el territorio y el espacio.','Antropología: estudia al ser humano y sus culturas.','Paleografía: ayuda a leer y estudiar escrituras antiguas.','Numismática: estudia monedas y medallas.','Cronología: ordena los hechos en el tiempo.'],e:'Para investigar una ciudad antigua, la Arqueología estudia sus restos, la Geografía analiza el territorio y la Paleografía ayuda a descifrar documentos.',q:[['¿Qué estudia la Arqueología?',['Restos materiales del pasado','Únicamente mapas actuales','Solo textos literarios'],0],['¿Qué disciplina estudia monedas y medallas?',['Numismática','Paleografía','Geografía'],0]]},
{t:'El tiempo histórico y la periodización',s:'Cómo organizamos el pasado',k:'La periodización es una herramienta para organizar y estudiar procesos; las etapas no son muros rígidos.',p:'El tiempo histórico permite ordenar procesos, reconocer simultaneidades y comprender cambios de distinta duración. Para facilitar el estudio se suele dividir la Historia en grandes etapas.',b:['Prehistoria: sociedades anteriores a la escritura.','Edad Antigua: primeras civilizaciones y mundo clásico.','Edad Media: sociedades medievales.','Edad Moderna: expansión oceánica, Renacimiento y grandes transformaciones.','Edad Contemporánea: desde las revoluciones modernas hasta la actualidad.','La cronología ayuda a ubicar hechos en secuencia y relacionarlos.'],e:'Ubicar un acontecimiento en la Edad Media o en la Edad Contemporánea ayuda a comprender su contexto, pero los cambios históricos no ocurren al mismo ritmo en todos los lugares.',q:[['¿Para qué sirve la periodización?',['Para organizar el pasado en etapas y facilitar su estudio','Para eliminar hechos incómodos','Para estudiar solo la Prehistoria'],0],['¿Cuál es el orden tradicional de las grandes etapas?',['Prehistoria, Antigua, Media, Moderna y Contemporánea','Antigua, Moderna, Medieval y Futurista','Prehistoria, Colonial y Digital'],0]]}
];
const esc=x=>String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
function norm(d={}){const c=[...new Set(Array.isArray(d.completedItems)?d.completedItems.map(Number):[])].filter(x=>x>=0&&x<5).sort();P={completedItems:c,unlockedItem:Math.min(Math.max(Number(d.unlockedItem)||0,0),4),currentItem:Math.min(Math.max(Number(d.currentItem)||0,0),4),attempts:d.attempts||{},itemScores:d.itemScores||{},percent:c.length*20,chapterCompleted:c.length===5};if(c.length)P.unlockedItem=Math.max(P.unlockedItem,Math.min(4,Math.max(...c)+1));cur=Math.min(P.currentItem,P.unlockedItem)}
function ref(){return db.collection('users').doc(user.uid).collection('progress').doc(DOC)}
async function load(){const s=await ref().get();norm(s.exists?s.data():{})}
async function save(){P.currentItem=cur;P.percent=P.completedItems.length*20;P.chapterCompleted=P.percent===100;await ref().set({courseId:12,courseName:'Historia Universal',chapterNumber:1,chapterName:'La historia como ciencia',currentItem:P.currentItem,unlockedItem:P.unlockedItem,completedItems:P.completedItems,attempts:P.attempts,itemScores:P.itemScores,percent:P.percent,chapterCompleted:P.chapterCompleted,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})}
function status(i){return P.completedItems.includes(i)?'done':i===cur?'current':i<=P.unlockedItem?'open':'locked'}
function side(){return I.map((x,i)=>{let s=status(i),dis=s==='locked',bg=s==='done'?'bg-emerald-50 border-emerald-200':s==='current'?'bg-blue-50 border-blue-200':'bg-white border-slate-200',ic=s==='done'?'✓':s==='locked'?'🔒':i+1;return `<button ${dis?'disabled':''} onclick="go(${i})" class="step w-full text-left rounded-2xl border ${bg} p-3 ${dis?'opacity-50':''}"><div class="flex gap-3 items-center"><span class="w-9 h-9 rounded-xl ${s==='done'?'bg-emerald-600':s==='current'?'bg-blue-950':'bg-slate-100'} ${s==='done'||s==='current'?'text-white':'text-slate-500'} grid place-items-center font-black text-sm">${ic}</span><div><div class="text-[10px] uppercase tracking-wider font-bold text-slate-400">Ítem ${i+1}</div><div class="font-bold text-sm text-slate-800">${x.t}</div></div></div></button>`}).join('')}
function quiz(x,i){if(P.completedItems.includes(i))return `<div class="mt-6 rounded-2xl border border-emerald-200 bg-emerald-50 p-5"><b class="text-emerald-800">¡Ítem aprobado!</b><p class="text-sm text-emerald-700 mt-1">Tu resultado está guardado en la nube.</p>${i<4?`<button onclick="go(${Math.min(i+1,P.unlockedItem)})" class="mt-3 px-4 py-2 rounded-xl bg-emerald-700 text-white font-bold text-sm">Continuar →</button>`:''}</div>`;return `<div class="mt-7 rounded-3xl border border-slate-200 overflow-hidden"><div class="p-5 bg-slate-50 border-b"><p class="text-xs font-bold uppercase tracking-wider text-red-600">Control de avance</p><h3 class="text-lg font-black mt-1">Responde 2 de 2 correctamente</h3><p class="text-sm text-slate-500 mt-1">Puedes volver a intentarlo si es necesario.</p></div><div class="p-5 space-y-5">${x.q.map((q,qi)=>`<fieldset><legend class="font-bold text-slate-800">${qi+1}. ${q[0]}</legend><div class="mt-2 grid gap-2">${q[1].map((o,oi)=>`<label class="ans flex gap-3 rounded-xl border border-slate-200 p-3 cursor-pointer"><input type="radio" name="q${qi}" value="${oi}" onchange="pick(${qi},${oi},this)"><span class="text-sm">${o}</span></label>`).join('')}</div></fieldset>`).join('')}<button onclick="check(${i})" class="px-5 py-3 rounded-xl bg-blue-950 text-white font-bold text-sm">Comprobar respuestas</button><div id="fb"></div></div></div>`}
function render(){const x=I[cur],pct=P.completedItems.length*20;document.getElementById('app').innerHTML=`<header class="bg-white border-b sticky top-0 z-30"><div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4"><a href="index.html" class="flex items-center gap-3"><span class="w-10 h-10 rounded-xl bg-blue-950 text-white grid place-items-center font-black">SL</span><span><b class="text-blue-950">SIN <i class="not-italic text-red-600">LÍMITES</i></b><small class="block uppercase tracking-[.18em] text-slate-400">Academia Virtual</small></span></a><span class="text-xs font-bold text-slate-500">Historia Universal · Capítulo 1</span></div></header><section class="bg-gradient-to-r from-blue-950 via-blue-900 to-slate-900 text-white"><div class="max-w-7xl mx-auto px-4 py-8 grid lg:grid-cols-[1fr_420px] gap-7 items-center"><div><span class="inline-flex px-3 py-1 rounded-full bg-white/10 text-xs font-bold">RUTA INTERACTIVA</span><h1 class="mt-4 text-3xl sm:text-5xl font-black">La historia como ciencia</h1><p class="mt-4 text-blue-100 max-w-2xl">Cinco aprendizajes esenciales, ilustraciones generadas con IA, ejemplos y microcuestionarios para avanzar paso a paso.</p><div class="mt-5 flex gap-3 flex-wrap text-xs font-semibold"><span class="px-3 py-2 rounded-xl bg-white/10">5 ítems</span><span class="px-3 py-2 rounded-xl bg-white/10">10 preguntas</span><span class="px-3 py-2 rounded-xl bg-white/10">Progreso en la nube</span></div></div><div class="rounded-3xl overflow-hidden border border-white/10 shadow-2xl bg-white">${V[0]}</div></div></section><section class="max-w-7xl mx-auto px-4 py-5"><div class="bg-white rounded-2xl border p-4 card"><div class="flex justify-between text-sm"><b>Mi progreso</b><b class="text-blue-950">${pct}%</b></div><div class="mt-2 h-3 bg-slate-100 rounded-full overflow-hidden"><div class="h-full bg-gradient-to-r from-red-500 to-emerald-500" style="width:${pct}%"></div></div></div></section><main class="max-w-7xl mx-auto px-4 pb-10 grid lg:grid-cols-[300px_1fr] gap-6"><aside class="space-y-2 lg:sticky lg:top-20 lg:self-start"><div class="bg-white rounded-3xl border p-4 card"><p class="text-xs font-bold uppercase tracking-wider text-red-600 mb-3">Ruta del capítulo</p>${side()}</div></aside><article class="bg-white rounded-3xl border overflow-hidden card"><div class="p-5 sm:p-7 border-b"><p class="text-xs font-bold uppercase tracking-wider text-red-600">Ítem ${cur+1} de 5 · ${x.s}</p><h2 class="mt-2 text-2xl sm:text-3xl font-black text-slate-900">${x.t}</h2></div><div class="p-5 sm:p-7"><div class="rounded-3xl overflow-hidden border border-slate-200 bg-white">${V[cur]}</div><div class="mt-2 text-xs text-slate-400">Ilustración conceptual generada con IA; no es una fotografía ni una fuente histórica original.</div><p class="mt-6 text-lg leading-relaxed text-slate-700">${x.p}</p><div class="mt-5 grid sm:grid-cols-2 gap-3">${x.b.map(b=>`<div class="rounded-2xl bg-slate-50 border border-slate-200 p-4 text-sm text-slate-600">✓ ${b}</div>`).join('')}</div><div class="mt-5 rounded-2xl border border-amber-200 bg-amber-50 p-5"><b class="text-amber-800">Idea clave</b><p class="mt-1 text-sm text-amber-900">${x.k}</p></div><div class="mt-4 rounded-2xl border border-blue-200 bg-blue-50 p-5"><b class="text-blue-800">Ejemplo didáctico</b><p class="mt-1 text-sm text-blue-900">${x.e}</p></div>${quiz(x,cur)}</div></article></main>`;lucide.createIcons()}
function pick(q,o,el){selected[q]=o;el.closest('fieldset').querySelectorAll('.ans').forEach(x=>x.classList.remove('sel'));el.closest('.ans').classList.add('sel')}
async function check(i){if(selected[0]===undefined||selected[1]===undefined){document.getElementById('fb').innerHTML='<p class="text-amber-600 font-bold text-sm">Responde las dos preguntas.</p>';return}let n=0;I[i].q.forEach((q,j)=>{if(selected[j]===q[2])n++});let score=n*50,key='item_'+(i+1);P.attempts[key]=Number(P.attempts[key]||0)+1;P.itemScores[key]=Math.max(Number(P.itemScores[key]||0),score);if(score===100){if(!P.completedItems.includes(i))P.completedItems.push(i);P.completedItems.sort();P.unlockedItem=Math.max(P.unlockedItem,Math.min(4,i+1));if(i<4)cur=Math.min(i+1,P.unlockedItem);await save();selected={};render()}else{await save();document.getElementById('fb').innerHTML=`<p class="text-red-600 font-bold text-sm">Obtuviste ${score}%. Necesitas 100% para avanzar. Revisa e inténtalo otra vez.</p>`}}
async function go(i){if(i>P.unlockedItem)return;cur=i;selected={};await save();render();window.scrollTo({top:0,behavior:'smooth'})}
auth.onAuthStateChanged(async u=>{if(!u){document.getElementById('app').innerHTML='<main class="min-h-screen grid place-items-center p-6"><div class="max-w-md bg-white border rounded-3xl p-8 text-center card"><h1 class="text-2xl font-black">Acceso requerido</h1><p class="mt-3 text-sm text-slate-500">Inicia sesión en SIN LÍMITES para guardar tu progreso.</p><a class="mt-6 inline-flex px-5 py-3 rounded-xl bg-blue-950 text-white font-bold" href="index.html">Ir a la portada</a></div></main>';return}user=u;try{await load()}catch(e){console.error(e)}render()});
