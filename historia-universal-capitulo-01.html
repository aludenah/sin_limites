<script>
const firebaseConfig={apiKey:'AIzaSyCurhmnJ21SMqGM6G54t8QM8jcqO8jV0OE',authDomain:'sin-limites-12f07.firebaseapp.com',projectId:'sin-limites-12f07',storageBucket:'sin-limites-12f07.firebasestorage.app',messagingSenderId:'757098079298',appId:'1:757098079298:web:068a9a7ea93149bfef79db'};
firebase.initializeApp(firebaseConfig);

const items=[
  {
    title:'¿Qué estudia la Historia?',
    short:'Concepto, objeto y finalidad',
    icon:'book-open',
    content:`
      <p class="text-lg leading-relaxed text-slate-700">La <strong>Historia</strong> es una ciencia social que estudia a las sociedades humanas a través del tiempo. No consiste en memorizar fechas: busca comprender <strong>cambios, permanencias, causas y consecuencias</strong>.</p>
      <div class="mt-6 grid md:grid-cols-2 gap-4">
        <div class="rounded-2xl bg-slate-50 border border-slate-200 p-5"><div class="flex items-center gap-3"><span class="w-9 h-9 rounded-xl bg-blue-950 text-white flex items-center justify-center"><i data-lucide="target" class="w-4 h-4"></i></span><h3 class="font-extrabold text-slate-900">Objeto de estudio</h3></div><p class="mt-3 text-sm leading-relaxed text-slate-600">La actividad humana en sociedad, situada en un tiempo y espacio determinados: política, economía, cultura, tecnología y vida cotidiana.</p></div>
        <div class="rounded-2xl bg-slate-50 border border-slate-200 p-5"><div class="flex items-center gap-3"><span class="w-9 h-9 rounded-xl bg-blue-950 text-white flex items-center justify-center"><i data-lucide="search" class="w-4 h-4"></i></span><h3 class="font-extrabold text-slate-900">Finalidad</h3></div><p class="mt-3 text-sm leading-relaxed text-slate-600">Comprender y explicar el pasado mediante evidencias para interpretar mejor el presente y los procesos de larga duración.</p></div>
      </div>
      <div class="mt-6 rounded-2xl border border-amber-200 bg-amber-50 p-5 text-sm text-amber-900"><strong>Idea clave:</strong> la Historia estudia procesos humanos, no una simple lista de acontecimientos.</div>`,
    quiz:[
      {q:'¿Cuál es el objeto central de estudio de la Historia?',options:['Los fenómenos naturales aislados','Las sociedades humanas en el tiempo','Únicamente las guerras','Solo los documentos escritos'],answer:1,why:'La Historia analiza la actividad humana en sociedad a través del tiempo.'},
      {q:'¿Qué expresa mejor la finalidad de la Historia?',options:['Memorizar todas las fechas','Predecir con certeza el futuro','Comprender y explicar procesos del pasado','Estudiar únicamente gobernantes'],answer:2,why:'Su finalidad es comprender y explicar procesos humanos a partir de evidencias.'}
    ]
  },
  {
    title:'¿Por qué la Historia es una ciencia?',
    short:'Evidencia, método e interpretación',
    icon:'microscope',
    content:`
      <p class="text-lg leading-relaxed text-slate-700">La Historia es una ciencia porque construye conocimiento mediante <strong>preguntas, evidencias, procedimientos sistemáticos y explicaciones argumentadas</strong>. Sus conclusiones pueden revisarse cuando aparecen nuevas fuentes o nuevas preguntas.</p>
      <div class="mt-6 grid sm:grid-cols-2 lg:grid-cols-4 gap-3">
        <div class="rounded-2xl border border-slate-200 p-4"><span class="text-xs font-black text-red-600">01</span><h3 class="mt-1 font-bold">Problematiza</h3><p class="mt-2 text-xs text-slate-500">Formula preguntas sobre el pasado.</p></div>
        <div class="rounded-2xl border border-slate-200 p-4"><span class="text-xs font-black text-red-600">02</span><h3 class="mt-1 font-bold">Busca evidencias</h3><p class="mt-2 text-xs text-slate-500">Localiza testimonios y restos.</p></div>
        <div class="rounded-2xl border border-slate-200 p-4"><span class="text-xs font-black text-red-600">03</span><h3 class="mt-1 font-bold">Contrasta</h3><p class="mt-2 text-xs text-slate-500">Compara fuentes y evalúa su confiabilidad.</p></div>
        <div class="rounded-2xl border border-slate-200 p-4"><span class="text-xs font-black text-red-600">04</span><h3 class="mt-1 font-bold">Interpreta</h3><p class="mt-2 text-xs text-slate-500">Elabora explicaciones fundamentadas.</p></div>
      </div>
      <div class="mt-6 rounded-2xl bg-blue-950 text-white p-5"><p class="text-sm text-blue-100"><strong class="text-white">Importante:</strong> una explicación histórica no es una opinión libre; debe estar sustentada en fuentes analizadas y contrastadas.</p></div>`,
    quiz:[
      {q:'¿Qué característica demuestra mejor el carácter científico de la Historia?',options:['Sus conclusiones nunca cambian','Usa métodos y evidencias contrastables','Depende solo de la memoria','Rechaza toda interpretación'],answer:1,why:'La investigación histórica usa procedimientos sistemáticos y evidencias que pueden ser examinadas.'},
      {q:'Si aparece una nueva fuente confiable, una explicación histórica puede…',options:['Ser revisada o ampliada','Permanecer obligatoriamente igual','Dejar de ser científica','Ignorar la nueva evidencia'],answer:0,why:'El conocimiento histórico puede revisarse cuando aparecen nuevas evidencias.'}
    ]
  },
  {
    title:'El método histórico',
    short:'De la pregunta a la explicación',
    icon:'route',
    content:`
      <p class="text-lg leading-relaxed text-slate-700">El <strong>método histórico</strong> organiza la investigación. Permite pasar de una pregunta inicial a una explicación sustentada.</p>
      <div class="mt-6 space-y-4">
        <div class="flex gap-4 rounded-2xl border border-slate-200 p-5"><span class="w-9 h-9 rounded-full bg-red-600 text-white font-black flex items-center justify-center shrink-0">1</span><div><h3 class="font-extrabold">Planteamiento del problema</h3><p class="mt-1 text-sm text-slate-600">Se delimita el tema y se formula una pregunta de investigación.</p></div></div>
        <div class="flex gap-4 rounded-2xl border border-slate-200 p-5"><span class="w-9 h-9 rounded-full bg-red-600 text-white font-black flex items-center justify-center shrink-0">2</span><div><h3 class="font-extrabold">Heurística</h3><p class="mt-1 text-sm text-slate-600">Se localizan, reúnen y seleccionan las fuentes útiles.</p></div></div>
        <div class="flex gap-4 rounded-2xl border border-slate-200 p-5"><span class="w-9 h-9 rounded-full bg-red-600 text-white font-black flex items-center justify-center shrink-0">3</span><div><h3 class="font-extrabold">Crítica de fuentes</h3><p class="mt-1 text-sm text-slate-600">Se analiza autenticidad, procedencia, contexto, intención y confiabilidad.</p></div></div>
        <div class="flex gap-4 rounded-2xl border border-slate-200 p-5"><span class="w-9 h-9 rounded-full bg-red-600 text-white font-black flex items-center justify-center shrink-0">4</span><div><h3 class="font-extrabold">Interpretación y síntesis</h3><p class="mt-1 text-sm text-slate-600">Se relacionan los datos y se construye una explicación coherente.</p></div></div>
      </div>`,
    quiz:[
      {q:'¿Cómo se llama la etapa dedicada a localizar y reunir fuentes?',options:['Cronología','Heurística','Síntesis','Periodización'],answer:1,why:'La heurística es la búsqueda y selección sistemática de fuentes.'},
      {q:'¿Qué se analiza durante la crítica de fuentes?',options:['Solo la antigüedad del documento','Autenticidad, procedencia e intención','Únicamente el tamaño de la fuente','Solo la opinión del investigador'],answer:1,why:'La crítica histórica evalúa la fuente, su contexto y su confiabilidad.'}
    ]
  },
  {
    title:'Las fuentes históricas',
    short:'Evidencias para conocer el pasado',
    icon:'archive',
    content:`
      <p class="text-lg leading-relaxed text-slate-700">Las <strong>fuentes históricas</strong> son testimonios o evidencias que permiten conocer aspectos del pasado. Su valor depende de la pregunta de investigación y de la crítica que realice el historiador.</p>
      <div class="mt-6 overflow-x-auto rounded-2xl border border-slate-200">
        <table class="w-full text-sm"><thead class="bg-slate-100"><tr><th class="text-left p-4">Tipo</th><th class="text-left p-4">Ejemplos</th><th class="text-left p-4">Pueden revelar</th></tr></thead><tbody class="divide-y divide-slate-100">
          <tr><td class="p-4 font-bold">Escritas</td><td class="p-4">Cartas, leyes, crónicas</td><td class="p-4">Ideas, normas y decisiones</td></tr>
          <tr><td class="p-4 font-bold">Materiales</td><td class="p-4">Cerámica, edificios, monedas</td><td class="p-4">Tecnología y vida cotidiana</td></tr>
          <tr><td class="p-4 font-bold">Orales</td><td class="p-4">Testimonios y tradiciones</td><td class="p-4">Memoria y experiencias</td></tr>
          <tr><td class="p-4 font-bold">Iconográficas</td><td class="p-4">Fotografías, pinturas, mapas</td><td class="p-4">Representaciones y símbolos</td></tr>
          <tr><td class="p-4 font-bold">Audiovisuales</td><td class="p-4">Grabaciones, cine, video</td><td class="p-4">Discursos, gestos y contextos</td></tr>
        </tbody></table>
      </div>
      <div class="mt-6 rounded-2xl border border-amber-200 bg-amber-50 p-5 text-sm text-amber-900"><strong>Clave:</strong> una fuente no “habla sola”. Debe contextualizarse, contrastarse e interpretarse.</div>`,
    quiz:[
      {q:'Una moneda antigua utilizada para estudiar el comercio es principalmente una fuente…',options:['Oral','Material','Audiovisual','Exclusivamente literaria'],answer:1,why:'La moneda es un objeto material producido en el pasado.'},
      {q:'¿Por qué se contrastan varias fuentes?',options:['Para eliminar toda diferencia','Para construir una explicación mejor sustentada','Para usar siempre la más antigua','Porque una sola fuente siempre es falsa'],answer:1,why:'Contrastar permite reconocer coincidencias, diferencias, sesgos y límites.'}
    ]
  },
  {
    title:'Ciencias auxiliares de la Historia',
    short:'Disciplinas que amplían la investigación',
    icon:'network',
    content:`
      <p class="text-lg leading-relaxed text-slate-700">La Historia se apoya en otras disciplinas para analizar distintos tipos de evidencia y comprender mejor a las sociedades del pasado.</p>
      <div class="mt-6 grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <div class="rounded-2xl border border-slate-200 p-5"><h3 class="font-extrabold">Arqueología</h3><p class="mt-2 text-sm text-slate-600">Estudia sociedades mediante restos materiales.</p></div>
        <div class="rounded-2xl border border-slate-200 p-5"><h3 class="font-extrabold">Antropología</h3><p class="mt-2 text-sm text-slate-600">Analiza al ser humano y sus culturas.</p></div>
        <div class="rounded-2xl border border-slate-200 p-5"><h3 class="font-extrabold">Geografía</h3><p class="mt-2 text-sm text-slate-600">Relaciona sociedad, territorio y espacio.</p></div>
        <div class="rounded-2xl border border-slate-200 p-5"><h3 class="font-extrabold">Paleografía</h3><p class="mt-2 text-sm text-slate-600">Estudia y descifra escrituras antiguas.</p></div>
        <div class="rounded-2xl border border-slate-200 p-5"><h3 class="font-extrabold">Numismática</h3><p class="mt-2 text-sm text-slate-600">Estudia monedas y medallas.</p></div>
        <div class="rounded-2xl border border-slate-200 p-5"><h3 class="font-extrabold">Cronología</h3><p class="mt-2 text-sm text-slate-600">Ordena acontecimientos y procesos en el tiempo.</p></div>
      </div>
      <div class="mt-6 rounded-3xl bg-blue-950 text-white p-6"><p class="text-xs font-bold uppercase tracking-[.18em] text-red-300">Síntesis del capítulo</p><div class="mt-4 grid md:grid-cols-2 gap-3 text-sm text-blue-100"><p>• La Historia es una <strong class="text-white">ciencia social</strong>.</p><p>• Estudia a la <strong class="text-white">sociedad humana en el tiempo</strong>.</p><p>• Utiliza <strong class="text-white">fuentes y método histórico</strong>.</p><p>• Sus explicaciones se construyen mediante <strong class="text-white">análisis y contraste</strong>.</p></div></div>`,
    quiz:[
      {q:'¿Qué disciplina estudia especialmente monedas y medallas?',options:['Paleografía','Numismática','Geografía','Cronología'],answer:1,why:'La numismática estudia monedas y medallas como evidencias históricas.'},
      {q:'Si se estudian viviendas y cerámicas de un asentamiento antiguo, ¿qué disciplina resulta especialmente útil?',options:['Arqueología','Gramática','Astronomía','Lógica'],answer:0,why:'La Arqueología analiza sociedades a partir de sus restos materiales.'}
    ]
  }
];

const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
const uniqueSorted=a=>[...new Set((Array.isArray(a)?a:[]).map(Number).filter(n=>n>=0&&n<TOTAL_ITEMS))].sort((a,b)=>a-b);
function percent(){return Math.round((progress.completedItems.length/TOTAL_ITEMS)*100)}
function normalizeProgress(data){const completed=uniqueSorted(data&&data.completedItems);const unlocked=Math.min(Math.max(Number(data&&data.unlockedItem)||0,0),TOTAL_ITEMS-1);const current=Math.min(Math.max(Number(data&&data.currentItem)||0,0),unlocked);progress={currentItem:current,unlockedItem:unlocked,completedItems:completed,attempts:(data&&data.attempts)||{},itemScores:(data&&data.itemScores)||{},percent:Math.round(completed.length/TOTAL_ITEMS*100),chapterCompleted:completed.length===TOTAL_ITEMS}}
function progressRef(){return db.collection('users').doc(currentUser.uid).collection('progress').doc(CHAPTER_ID)}
async function loadProgress(){try{const snap=await progressRef().get();if(snap.exists)normalizeProgress(snap.data());else await saveProgress();}catch(e){console.error('Carga de progreso:',e)}}
async function saveProgress(){if(!currentUser)return;progress.percent=percent();progress.chapterCompleted=progress.completedItems.length===TOTAL_ITEMS;try{await progressRef().set({courseId:12,courseName:'Historia Universal',chapterNumber:1,chapterName:'La historia como ciencia',currentItem:progress.currentItem,unlockedItem:progress.unlockedItem,completedItems:progress.completedItems,attempts:progress.attempts,itemScores:progress.itemScores,percent:progress.percent,chapterCompleted:progress.chapterCompleted,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})}catch(e){console.error('Guardado de progreso:',e)}}

function renderLocked(){return `<main class="min-h-screen flex items-center justify-center p-5 bg-slate-50"><div class="max-w-md w-full bg-white rounded-3xl border border-slate-200 p-8 text-center shadow-sm"><div class="w-14 h-14 mx-auto rounded-2xl bg-blue-950 text-white flex items-center justify-center"><i data-lucide="lock" class="w-6 h-6"></i></div><h1 class="mt-5 text-2xl font-black text-slate-900">Acceso requerido</h1><p class="mt-3 text-sm leading-relaxed text-slate-500">Inicia sesión en SIN LÍMITES para continuar tu ruta de aprendizaje y guardar tu progreso.</p><a href="index.html" class="mt-6 inline-flex px-5 py-3 rounded-xl bg-blue-950 text-white font-bold text-sm">Ir a iniciar sesión</a></div></main>`}
function itemStatus(i){if(progress.completedItems.includes(i))return 'done';if(i===progress.currentItem)return 'current';if(i<=progress.unlockedItem)return 'open';return 'locked'}
function sidebar(){return items.map((it,i)=>{const s=itemStatus(i);const disabled=s==='locked';const icon=s==='done'?'check':s==='locked'?'lock':String(i+1);const circle=s==='done'?'bg-emerald-600 text-white':s==='current'?'bg-blue-950 text-white':s==='open'?'bg-blue-50 text-blue-950':'bg-slate-100 text-slate-400';const row=s==='current'?'bg-blue-50 border-blue-200':s==='done'?'bg-emerald-50/60 border-emerald-100':'bg-white border-slate-200';return `<button ${disabled?'disabled':''} onclick="goToItem(${i})" class="step-btn w-full text-left rounded-2xl border ${row} p-3.5 ${disabled?'opacity-55 cursor-not-allowed':''}"><div class="flex items-center gap-3"><span class="w-9 h-9 rounded-xl ${circle} flex items-center justify-center shrink-0 text-xs font-black">${s==='done'||s==='locked'?`<i data-lucide="${icon}" class="w-4 h-4"></i>`:icon}</span><div class="min-w-0"><div class="text-[11px] font-bold uppercase tracking-wider ${s==='done'?'text-emerald-700':s==='current'?'text-blue-900':'text-slate-400'}">Ítem ${i+1}</div><div class="mt-0.5 text-sm font-bold text-slate-800 leading-tight">${esc(it.title)}</div></div></div></button>`}).join('')}
function quizHtml(item,i){if(progress.completedItems.includes(i)){return `<div class="mt-8 rounded-3xl border border-emerald-200 bg-emerald-50 p-6"><div class="flex items-start gap-3"><span class="w-10 h-10 rounded-xl bg-emerald-600 text-white flex items-center justify-center shrink-0"><i data-lucide="check" class="w-5 h-5"></i></span><div><h3 class="font-extrabold text-emerald-900">Ítem aprobado</h3><p class="mt-1 text-sm text-emerald-800">Ya superaste este microcuestionario. Tu avance está guardado en la nube.</p>${i<TOTAL_ITEMS-1?`<button onclick="goToItem(${Math.min(i+1,progress.unlockedItem)})" class="mt-4 inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-emerald-700 text-white text-sm font-bold">Continuar <i data-lucide="arrow-right" class="w-4 h-4"></i></button>`:`<div class="mt-4 text-sm font-bold text-emerald-900">¡Capítulo completado!</div>`}</div></div></div>`}
return `<div class="mt-8 rounded-3xl border border-slate-200 overflow-hidden"><div class="p-5 sm:p-6 bg-slate-50 border-b border-slate-200"><div class="flex items-start gap-3"><span class="w-10 h-10 rounded-xl bg-red-50 text-red-600 flex items-center justify-center shrink-0"><i data-lucide="badge-check" class="w-5 h-5"></i></span><div><div class="text-xs font-bold uppercase tracking-wider text-red-600">Control de avance</div><h3 class="mt-1 text-lg font-extrabold text-slate-900">Responde 2 de 2 para desbloquear el siguiente ítem</h3><p class="mt-1 text-sm text-slate-500">Puedes intentarlo nuevamente si no alcanzas el puntaje requerido.</p></div></div></div><form id="microquiz" class="p-5 sm:p-6 space-y-6">${item.quiz.map((q,qi)=>`<fieldset><legend class="font-bold text-slate-900">${qi+1}. ${esc(q.q)}</legend><div class="mt-3 grid gap-2">${q.options.map((op,oi)=>`<label class="answer-label flex items-start gap-3 rounded-xl border border-slate-200 p-3.5 cursor-pointer"><input type="radio" name="q${qi}" value="${oi}" class="mt-1" onchange="markSelected(this)"><span class="text-sm text-slate-700">${esc(op)}</span></label>`).join('')}</div></fieldset>`).join('')}<button type="button" onclick="submitQuiz()" class="inline-flex items-center gap-2 px-5 py-3 rounded-xl bg-blue-950 text-white font-bold text-sm hover:bg-blue-900">Comprobar respuestas <i data-lucide="check-circle" class="w-4 h-4"></i></button><div id="quizFeedback"></div></form></div>`}
function renderApp(){const i=progress.currentItem,item=items[i];const p=percent();document.getElementById('app').innerHTML=`
<header class="bg-white border-b border-slate-200 sticky top-0 z-40"><div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 min-h-18 py-3 flex items-center justify-between gap-4"><a href="index.html" class="flex items-center gap-3"><span class="w-10 h-10 rounded-xl bg-blue-950 text-white flex items-center justify-center font-black">SL</span><div><div class="font-black text-blue-950 leading-tight">SIN <span class="text-red-600">LÍMITES</span></div><div class="text-[10px] uppercase tracking-[.18em] text-slate-400">Historia Universal</div></div></a><div class="flex items-center gap-3"><div class="hidden sm:block text-right"><div class="text-xs font-bold text-slate-700">${esc(currentUser.displayName||'Estudiante')}</div><div class="text-[11px] text-slate-400">Progreso guardado en la nube</div></div>${currentUser.photoURL?`<img src="${esc(currentUser.photoURL)}" class="w-9 h-9 rounded-full border border-slate-200" alt="Perfil">`:''}</div></div></header>
<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
  <section class="rounded-3xl bg-gradient-to-r from-blue-950 to-blue-900 text-white p-6 sm:p-8"><div class="flex flex-col lg:flex-row lg:items-end lg:justify-between gap-6"><div><div class="text-xs font-bold uppercase tracking-[.18em] text-red-300">Historia Universal · Capítulo 01</div><h1 class="mt-2 text-3xl sm:text-4xl font-black">La historia como ciencia</h1><p class="mt-3 max-w-2xl text-sm sm:text-base text-blue-100">Avanza por los 5 ítems. Cada microcuestionario aprobado desbloquea el siguiente.</p></div><div class="lg:w-72"><div class="flex items-center justify-between text-sm"><span class="font-bold">Tu progreso</span><span class="font-black">${p}%</span></div><div class="mt-2 h-3 rounded-full bg-white/15 overflow-hidden"><div class="h-full bg-red-400 rounded-full transition-all" style="width:${p}%"></div></div><div class="mt-2 text-xs text-blue-200">${progress.completedItems.length} de ${TOTAL_ITEMS} ítems aprobados</div></div></div></section>
  ${progress.chapterCompleted?`<section class="mt-5 rounded-3xl border border-emerald-200 bg-emerald-50 p-5 sm:p-6"><div class="flex items-center gap-4"><span class="w-12 h-12 rounded-2xl bg-emerald-600 text-white flex items-center justify-center"><i data-lucide="trophy" class="w-6 h-6"></i></span><div><h2 class="font-black text-emerald-900">¡Capítulo completado!</h2><p class="mt-1 text-sm text-emerald-800">Superaste los cinco controles de avance. Tu progreso quedó registrado.</p></div></div></section>`:''}
  <div class="mt-6 grid lg:grid-cols-[290px_1fr] gap-6 items-start"><aside class="lg:sticky lg:top-24"><div class="bg-white rounded-3xl border border-slate-200 p-4"><div class="px-2 pb-3"><div class="text-xs font-bold uppercase tracking-wider text-slate-400">Ruta del capítulo</div></div><div class="space-y-2">${sidebar()}</div></div></aside><section class="min-w-0"><article class="fade-in bg-white rounded-3xl border border-slate-200 p-6 sm:p-8"><div class="flex items-start justify-between gap-5"><div class="flex items-start gap-4"><span class="w-12 h-12 rounded-2xl bg-blue-50 text-blue-950 flex items-center justify-center shrink-0"><i data-lucide="${item.icon}" class="w-6 h-6"></i></span><div><div class="text-xs font-bold uppercase tracking-wider text-red-600">Ítem ${i+1} de ${TOTAL_ITEMS}</div><h2 class="mt-1 text-2xl sm:text-3xl font-black text-slate-900">${esc(item.title)}</h2><p class="mt-1 text-sm text-slate-400">${esc(item.short)}</p></div></div>${progress.completedItems.includes(i)?'<span class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-emerald-50 text-emerald-700 text-xs font-bold"><i data-lucide="check" class="w-3.5 h-3.5"></i>Aprobado</span>':''}</div><div class="mt-7">${item.content}</div>${quizHtml(item,i)}</article></section></div>
</main>`;
lucide.createIcons();window.scrollTo({top:0,behavior:'smooth'});}
function markSelected(input){document.querySelectorAll(`input[name="${input.name}"]`).forEach(el=>el.closest('label').classList.remove('selected'));input.closest('label').classList.add('selected')}
async function goToItem(i){if(i>progress.unlockedItem||i<0||i>=TOTAL_ITEMS)return;progress.currentItem=i;feedback=null;await saveProgress();renderApp()}
async function submitQuiz(){const i=progress.currentItem,item=items[i];const form=document.getElementById('microquiz');if(!form)return;let score=0;let answered=0;const details=[];item.quiz.forEach((q,qi)=>{const selected=form.querySelector(`input[name="q${qi}"]:checked`);if(selected){answered++;const value=Number(selected.value);if(value===q.answer)score++;details.push({correct:value===q.answer,why:q.why})}});const box=document.getElementById('quizFeedback');if(answered<item.quiz.length){box.innerHTML='<div class="rounded-xl border border-amber-200 bg-amber-50 p-4 text-sm text-amber-900">Responde todas las preguntas antes de comprobar.</div>';return}const key=`item_${i+1}`;progress.attempts[key]=(Number(progress.attempts[key])||0)+1;progress.itemScores[key]=Math.round(score/item.quiz.length*100);if(score===item.quiz.length){if(!progress.completedItems.includes(i))progress.completedItems.push(i);progress.completedItems=uniqueSorted(progress.completedItems);progress.unlockedItem=Math.min(Math.max(progress.unlockedItem,i+1),TOTAL_ITEMS-1);await saveProgress();box.innerHTML=`<div class="rounded-2xl border border-emerald-200 bg-emerald-50 p-5 text-emerald-900"><div class="font-extrabold">¡Excelente! ${score}/${item.quiz.length} respuestas correctas.</div><p class="mt-1 text-sm">${i<TOTAL_ITEMS-1?'Se desbloqueó el siguiente ítem.':'Completaste la ruta teórica del capítulo.'}</p><button type="button" onclick="${i<TOTAL_ITEMS-1?`goToItem(${i+1})`:'renderApp()'}" class="mt-4 px-4 py-2.5 rounded-xl bg-emerald-700 text-white text-sm font-bold">${i<TOTAL_ITEMS-1?'Ir al siguiente ítem':'Ver capítulo completado'}</button></div>`}else{await saveProgress();box.innerHTML=`<div class="rounded-2xl border border-red-200 bg-red-50 p-5 text-red-900"><div class="font-extrabold">Obtuviste ${score}/${item.quiz.length}.</div><p class="mt-1 text-sm">Revisa el contenido e inténtalo nuevamente. Necesitas responder correctamente las 2 preguntas.</p><div class="mt-3 space-y-2 text-sm">${details.map((d,idx)=>`<p><strong>${idx+1}.</strong> ${d.correct?'Correcta.':'Revisa:'} ${esc(d.why)}</p>`).join('')}</div></div>`}lucide.createIcons()}

auth.onAuthStateChanged(async user=>{if(!user){document.getElementById('app').innerHTML=renderLocked();lucide.createIcons();return}currentUser=user;await loadProgress();renderApp()});
</script>
</body>
</html>
