function saveLocalProgress(){try{localStorage.setItem('academia-sm-state',JSON.stringify({activeCourseId:state.activeCourseId,activeTopicIndex:state.activeTopicIndex}))}catch(e){}}
function loadLocalProgress(){try{const s=JSON.parse(localStorage.getItem('academia-sm-state')||'null');if(s&&COURSES.some(c=>c.id===s.activeCourseId)){state.activeCourseId=s.activeCourseId;state.activeTopicIndex=Math.min(Math.max(Number(s.activeTopicIndex)||0,0),23)}}catch(e){}}
async function ensureUserProfile(user){if(!user)return;try{await db.collection('users').doc(user.uid).set({displayName:user.displayName||'',email:user.email||'',photoURL:user.photoURL||'',provider:(user.providerData&&user.providerData[0]&&user.providerData[0].providerId)||'google.com',lastLoginAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})}catch(e){console.error('Firestore profile:',e)}}
async function saveCloudProgress(){if(!currentUser||state.activeCourseId==null)return;const course=COURSES.find(c=>c.id===state.activeCourseId);if(!course)return;try{await db.collection('users').doc(currentUser.uid).collection('progress').doc('navigation').set({lastCourseId:course.id,lastCourseName:course.name,lastTopicIndex:state.activeTopicIndex,lastChapterNumber:state.activeTopicIndex+1,lastChapterName:course.topics[state.activeTopicIndex]||'',updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});cloudProgressReady=true}catch(e){console.error('Firestore progress save:',e)}}
function saveProgress(){saveLocalProgress();saveCloudProgress()}
async function loadCloudProgress(){if(!currentUser)return;try{const snap=await db.collection('users').doc(currentUser.uid).collection('progress').doc('navigation').get();if(snap.exists){const p=snap.data()||{};const courseId=Number(p.lastCourseId);if(COURSES.some(c=>c.id===courseId)){state.activeCourseId=courseId;const course=COURSES.find(c=>c.id===courseId);state.activeTopicIndex=Math.min(Math.max(Number(p.lastTopicIndex)||0,0),course.topics.length-1)}}cloudProgressReady=true}catch(e){console.error('Firestore progress load:',e)}}
async function loadProgress(){loadLocalProgress();await loadCloudProgress()}

function renderHeader(){const u=currentUser||{};return `<header class="bg-white border-b border-slate-200 sticky top-0 z-40"><div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 min-h-20 py-3 flex items-center justify-between gap-4"><button onclick="goHome()" class="flex items-center gap-3 min-w-0 text-left"><div class="w-11 h-11 rounded-2xl bg-blue-950 text-white flex items-center justify-center shrink-0 shadow-sm font-black">SL</div><div class="min-w-0"><div class="font-black text-blue-950 tracking-tight leading-tight truncate">SIN <span class="text-red-600">LÍMITES</span></div><div class="text-[11px] uppercase tracking-[0.18em] text-slate-400 truncate">Academia Virtual · Admisión 2026-II</div></div></button><div class="flex items-center gap-2 sm:gap-3"><span class="hidden lg:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-emerald-50 text-emerald-700 text-[11px] font-bold"><i data-lucide="cloud-check" class="w-3.5 h-3.5"></i>Progreso en la nube</span>${u.photoURL?`<img src="${esc(u.photoURL)}" alt="Perfil" class="w-9 h-9 rounded-full border border-slate-200 object-cover">`:'<div class="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center"><i data-lucide="user" class="w-4 h-4"></i></div>'}<div class="hidden md:block text-right max-w-44"><div class="text-xs font-bold text-slate-700 truncate">${esc(u.displayName||'Estudiante')}</div><div class="text-[11px] text-slate-400 truncate">${esc(u.email||'')}</div></div><button onclick="logout()" class="inline-flex items-center gap-2 px-3 py-2 rounded-xl border border-slate-200 text-xs font-semibold text-slate-500 hover:text-red-600 hover:border-red-200"><i data-lucide="log-out" class="w-4 h-4"></i><span class="hidden sm:inline">Salir</span></button></div></div></header>`}
function filteredCourses(){const t=state.search.trim().toLowerCase();return COURSES.filter(c=>(state.category==='Todos'||c.category===state.category)&&(!t||c.name.toLowerCase().includes(t)||c.topics.some(x=>x.toLowerCase().includes(t))))}
function renderCatalog(){const courses=filteredCourses();const cats=CATEGORIES.map(cat=>`<button onclick="setCategory('${esc(cat)}')" class="px-4 py-2 rounded-full text-sm font-semibold border transition ${state.category===cat?'bg-blue-950 text-white border-blue-950':'bg-white text-slate-600 border-slate-200 hover:border-blue-300 hover:text-blue-950'}">${esc(cat)}</button>`).join('');const cards=courses.map(c=>`<button onclick="openCourse(${c.id})" class="course-card bg-white rounded-3xl border border-slate-200 p-5 text-left group w-full"><div class="flex items-start justify-between gap-4"><div class="w-12 h-12 rounded-2xl bg-blue-50 text-blue-950 flex items-center justify-center group-hover:bg-blue-950 group-hover:text-white transition"><i data-lucide="${esc(c.icon)}" class="w-6 h-6"></i></div><span class="text-[11px] font-bold uppercase tracking-wider text-slate-400 bg-slate-50 px-2.5 py-1 rounded-full">${esc(c.category)}</span></div><h3 class="mt-5 text-lg font-extrabold text-slate-900 leading-snug">${esc(c.name)}</h3><p class="mt-2 text-sm text-slate-500 line-clamp-2">${esc(c.topics[0])} · ${esc(c.topics[1])} · …</p><div class="mt-5 pt-4 border-t border-slate-100 flex items-center justify-between"><div class="flex items-center gap-2 text-sm font-semibold text-slate-500"><i data-lucide="layers-3" class="w-4 h-4"></i>24 capítulos</div><span class="text-blue-950 group-hover:text-red-600 transition"><i data-lucide="arrow-right" class="w-5 h-5"></i></span></div></button>`).join('');return `${renderHeader()}<main><section class="relative overflow-hidden bg-gradient-to-br from-blue-950 via-blue-900 to-slate-900 text-white"><div class="absolute inset-0 opacity-10" style="background-image:radial-gradient(circle at 1px 1px,white 1px,transparent 0);background-size:28px 28px"></div><div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 sm:py-20"><div class="max-w-3xl"><div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-white/10 border border-white/10 text-xs font-semibold mb-6"><i data-lucide="target" class="w-4 h-4 text-red-400"></i>Temario estructurado para la Prueba General de Admisión 2026-II</div><h1 class="text-4xl sm:text-6xl font-black tracking-tight leading-[1.04]">Tu ruta de estudio,<br><span class="text-red-400">curso por curso.</span></h1><p class="mt-6 text-base sm:text-lg text-blue-100 max-w-2xl leading-relaxed">Los contenidos del temario han sido organizados en 18 cursos. Cada curso cuenta con 24 capítulos para facilitar una programación académica uniforme.</p></div></div></section><section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10"><div class="bg-white border border-slate-200 rounded-3xl p-4 sm:p-5 shadow-sm"><div class="relative"><i data-lucide="search" class="w-5 h-5 text-slate-400 absolute left-4 top-1/2 -translate-y-1/2"></i><input id="searchInput" value="${esc(state.search)}" oninput="setSearch(this.value)" placeholder="Buscar curso o capítulo..." class="w-full pl-12 pr-4 py-3.5 rounded-2xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-900/20 focus:border-blue-900 text-sm"></div><div class="mt-4 flex flex-wrap gap-2">${cats}</div></div><div class="mt-8 flex items-end justify-between gap-4"><div><p class="text-sm font-semibold text-red-600 uppercase tracking-wider">Malla académica</p><h2 class="text-2xl sm:text-3xl font-black text-slate-900 mt-1">${courses.length} curso${courses.length===1?'':'s'}</h2></div><p class="hidden sm:block text-sm text-slate-500">Selecciona un curso para ver sus 24 capítulos.</p></div><div class="mt-6 grid sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">${cards||'<div class="sm:col-span-2 lg:col-span-3 xl:col-span-4 bg-white border border-dashed border-slate-300 rounded-3xl p-12 text-center">No encontramos coincidencias.</div>'}</div></section></main><footer class="border-t border-slate-200 bg-white mt-8"><div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-7 text-xs text-slate-400 flex flex-col sm:flex-row gap-2 justify-between"><span>SIN LÍMITES · Academia Virtual</span><span>18 cursos · 432 capítulos</span></div></footer>`}
function specialHistoryContent(course){if(course.id===12&&state.activeTopicIndex===0)return `<div class="bg-white rounded-3xl border border-slate-200 overflow-hidden"><div class="p-5 sm:p-6 border-b border-slate-100 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3"><div><p class="text-xs font-bold uppercase tracking-[.18em] text-red-600">Contenido desarrollado</p><h3 class="mt-1 text-xl font-extrabold text-slate-900">La historia como ciencia</h3><p class="mt-1 text-sm text-slate-500">Teoría, práctica, evaluación interactiva y materiales de repaso.</p></div><a href="historia-universal-capitulo-01.html" target="_blank" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-blue-950 text-white text-sm font-bold">Abrir en pantalla completa <i data-lucide="external-link" class="w-4 h-4"></i></a></div><iframe title="Capítulo 1 - La historia como ciencia" src="historia-universal-capitulo-01.html" class="w-full bg-white" style="height:1100px;border:0"></iframe></div>`;return null}
function renderCourse(){const course=COURSES.find(c=>c.id===state.activeCourseId)||COURSES[0],topic=course.topics[state.activeTopicIndex],tab=TAB_INFO[state.activeTab];const chapterButtons=course.topics.map((name,idx)=>`<button onclick="setTopic(${idx})" class="chapter-btn w-full flex items-center gap-3 px-3 py-3 rounded-xl text-left ${idx===state.activeTopicIndex?'bg-blue-950 text-white':'text-slate-600 hover:bg-slate-100'}"><span class="text-[11px] font-bold w-7 shrink-0 ${idx===state.activeTopicIndex?'text-red-300':'text-slate-400'}">${String(idx+1).padStart(2,'0')}</span><span class="text-sm font-medium leading-snug">${esc(name)}</span></button>`).join('');const special=specialHistoryContent(course);const tabs=Object.keys(TAB_INFO).map(name=>`<button onclick="setTab('${name}')" class="px-4 py-3 text-sm font-semibold whitespace-nowrap border-b-2 transition ${state.activeTab===name?'text-blue-950 border-red-600':'text-slate-400 border-transparent hover:text-slate-700'}">${name}</button>`).join('');const prevDisabled=state.activeTopicIndex===0,nextDisabled=state.activeTopicIndex===course.topics.length-1;const standard=`<div class="bg-white rounded-3xl border border-slate-200 overflow-hidden"><div class="p-6 sm:p-8 bg-gradient-to-r from-blue-950 to-blue-900 text-white"><p class="text-xs font-bold uppercase tracking-[.18em] text-blue-200">Capítulo ${String(state.activeTopicIndex+1).padStart(2,'0')} de 24</p><h2 class="mt-3 text-2xl sm:text-4xl font-black leading-tight">${esc(topic)}</h2><p class="mt-3 text-sm text-blue-100">${esc(course.name)} · Temario 2026-II</p></div><div class="px-4 sm:px-6 border-b border-slate-100 overflow-x-auto custom-scrollbar"><div class="flex min-w-max">${tabs}</div></div><div class="p-6 sm:p-8"><div class="fade-in"><div class="w-12 h-12 rounded-2xl bg-red-50 text-red-600 flex items-center justify-center"><i data-lucide="${tab.icon}" class="w-6 h-6"></i></div><h3 class="mt-5 text-xl font-extrabold text-slate-900">${tab.title}</h3><p class="mt-2 text-slate-600 leading-relaxed max-w-3xl">${tab.text}</p><div class="mt-7 rounded-2xl border border-dashed border-slate-300 bg-slate-50 p-5 sm:p-6"><div class="flex items-start gap-3"><i data-lucide="construction" class="w-5 h-5 text-amber-500 mt-0.5 shrink-0"></i><div><p class="font-semibold text-slate-700">Estructura académica creada</p><p class="mt-1 text-sm text-slate-500">El capítulo ya forma parte de la malla. En la siguiente etapa podemos incorporar el contenido académico de esta sección.</p></div></div></div></div></div></div>`;return `${renderHeader()}<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6"><div class="mb-5 flex flex-wrap items-center gap-3"><button onclick="goHome()" class="inline-flex items-center gap-2 px-3 py-2 rounded-xl bg-white border border-slate-200 text-sm font-semibold text-slate-600 hover:text-blue-950"><i data-lucide="arrow-left" class="w-4 h-4"></i> Cursos</button><span class="text-xs font-bold uppercase tracking-wider text-slate-400">${esc(course.category)}</span></div><div class="grid lg:grid-cols-[330px_1fr] gap-6 min-h-[72vh]"><aside class="bg-white rounded-3xl border border-slate-200 overflow-hidden lg:sticky lg:top-24 lg:h-[calc(100vh-7.5rem)]"><div class="p-5 border-b border-slate-100"><div class="flex items-center gap-3"><div class="w-11 h-11 rounded-2xl bg-blue-50 text-blue-950 flex items-center justify-center shrink-0"><i data-lucide="${esc(course.icon)}" class="w-5 h-5"></i></div><div><h1 class="font-extrabold text-slate-900 leading-tight">${esc(course.name)}</h1><p class="text-xs text-slate-400 mt-1">24 capítulos</p></div></div></div><div class="p-3 overflow-y-auto custom-scrollbar h-[calc(100%-86px)]">${chapterButtons}</div></aside><section class="min-w-0">${special||standard}<div class="mt-4 px-2 py-3 flex items-center justify-between gap-4"><button onclick="moveTopic(-1)" ${prevDisabled?'disabled':''} class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-semibold border border-slate-200 ${prevDisabled?'text-slate-300 cursor-not-allowed':'text-slate-600 hover:text-blue-950 hover:border-blue-300'}"><i data-lucide="chevron-left" class="w-4 h-4"></i> Anterior</button><div class="hidden sm:block text-xs text-slate-400">${state.activeTopicIndex+1} / 24</div><button onclick="moveTopic(1)" ${nextDisabled?'disabled':''} class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-semibold border border-slate-200 ${nextDisabled?'text-slate-300 cursor-not-allowed':'text-slate-600 hover:text-blue-950 hover:border-blue-300'}">Siguiente <i data-lucide="chevron-right" class="w-4 h-4"></i></button></div></section></div></main>`}
function render(){document.getElementById('app').innerHTML=state.view==='course'?renderCourse():renderCatalog();lucide.createIcons()}
function openCourse(id){state.activeCourseId=id;state.activeTopicIndex=0;state.activeTab='Teoría';state.view='course';saveProgress();window.scrollTo(0,0);render()}
function goHome(){state.view='catalog';window.scrollTo(0,0);render()}
function setTopic(i){state.activeTopicIndex=i;state.activeTab='Teoría';saveProgress();render();window.scrollTo({top:0,behavior:'smooth'})}
function moveTopic(d){const c=COURSES.find(c=>c.id===state.activeCourseId),n=state.activeTopicIndex+d;if(n>=0&&n<c.topics.length)setTopic(n)}
function setTab(t){if(TAB_INFO[t]){state.activeTab=t;render()}}
function setCategory(c){state.category=c;render()}
function setSearch(v){state.search=v;render();const i=document.getElementById('searchInput');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}
async function loginWithGoogle(){authMessage='';try{await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);await auth.signInWithPopup(googleProvider)}catch(e){console.error('Firebase Authentication:',e);const code=e&&e.code?e.code:'';if(code==='auth/popup-closed-by-user'||code==='auth/cancelled-popup-request')return;const messages={'auth/popup-blocked':'El navegador bloqueó la ventana de Google. Permite las ventanas emergentes para este sitio e inténtalo nuevamente.','auth/unauthorized-domain':'El dominio de esta página no está autorizado en Firebase Authentication.','auth/operation-not-allowed':'El acceso con Google todavía no está habilitado en Firebase Authentication.','auth/network-request-failed':'No se pudo conectar con Google/Firebase. Revisa tu conexión e inténtalo nuevamente.','auth/web-storage-unsupported':'El navegador está bloqueando el almacenamiento necesario para iniciar sesión.','auth/internal-error':'Firebase encontró un error interno durante el inicio de sesión.'};authMessage=messages[code]||`No se pudo iniciar sesión${code?` (${code})`:''}. Intenta nuevamente.`;document.getElementById('app').innerHTML=renderLogin();lucide.createIcons()}}
async function logout(){try{await auth.signOut()}catch(e){}}
auth.onAuthStateChanged(async user=>{if(user){authMessage='';currentUser=user;await ensureUserProfile(user);await loadProgress();render()}else{currentUser=null;cloudProgressReady=false;document.getElementById('app').innerHTML=renderLogin();lucide.createIcons()}});
</script></body></html>
