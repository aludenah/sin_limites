<text x="74" y="1010" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#587081">CT = CF + CV. CMe = CT/Q. El costo marginal se calcula comparando cambios.</text>
