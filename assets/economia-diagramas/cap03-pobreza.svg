<svg xmlns="http://www.w3.org/2000/svg" width="1448" height="1086" viewBox="0 0 1448 1086" role="img"><title>Interpretar una línea de pobreza</title><desc>Ejemplo hipotético · gasto mensual por persona, en soles.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10" fill="#587081"/></marker></defs>
<rect width="1448" height="1086" fill="#f4f7f9"/><rect width="1448" height="14" fill="#ba3e45"/>
<text x="74" y="74" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#587081">SIN LÍMITES  /  ECONOMÍA  /  03</text>
<text x="74" y="149" font-family="DejaVu Sans,Arial,sans-serif" font-size="54" font-weight="800" text-anchor="start" fill="#102d48">Interpretar una línea de pobreza</text>
<text x="74" y="260" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#587081">Ejemplo hipotético · gasto mensual por persona, en soles.</text>
<rect x="215" y="330" width="1159" height="170" rx="22" fill="#ffffff" stroke="#d9e3e9" stroke-width="2"/>
<rect x="215" y="330" width="18" height="170" rx="0" fill="#0a7376" stroke="#0a7376" stroke-width="2"/>
<text x="260" y="395" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="800" text-anchor="start" fill="#0a7376">No pobre monetario</text>
<text x="260" y="442" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#203a4e">Gasto igual o superior a S/ 500</text>
<rect x="215" y="520" width="1159" height="150" rx="22" fill="#ffffff" stroke="#d9e3e9" stroke-width="2"/>
<rect x="215" y="520" width="18" height="150" rx="0" fill="#a76812" stroke="#a76812" stroke-width="2"/>
<text x="260" y="585" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="800" text-anchor="start" fill="#a76812">Pobre no extremo</text>
<text x="260" y="632" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#203a4e">Desde S/ 280 y por debajo de S/ 500</text>
<rect x="215" y="690" width="1159" height="160" rx="22" fill="#ffffff" stroke="#d9e3e9" stroke-width="2"/>
<rect x="215" y="690" width="18" height="160" rx="0" fill="#ba3e45" stroke="#ba3e45" stroke-width="2"/>
<text x="260" y="755" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="800" text-anchor="start" fill="#ba3e45">Pobre extremo</text>
<text x="260" y="802" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#203a4e">Gasto por debajo de S/ 280</text>
<line x1="161" y1="858" x2="161" y2="330" stroke="#587081" stroke-width="3" marker-end="url(#arrow)"/>
<text x="145" y="917" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#587081">Mayor gasto ↑</text>
<line x1="74" y1="968" x2="1374" y2="968" stroke="#c6d6df" stroke-width="2"/>
<text x="74" y="1010" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#587081">Los montos ilustran el método. No son líneas oficiales de pobreza de ningún periodo.</text>
</svg>