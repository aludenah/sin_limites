<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="title desc"><title id="title">Traslada la torre de A a C</title><desc id="desc">Tres postes A, B y C. En A hay tres discos: grande abajo, mediano en medio y pequeño arriba. B y C están vacíos.</desc><rect width="760" height="350" fill="#ffffff"/><line x1="50" y1="260" x2="250" y2="260" stroke="#18334c" stroke-width="6" stroke-linecap="round" /><line x1="150" y1="70" x2="150" y2="260" stroke="#18334c" stroke-width="6" stroke-linecap="round" /><text x="150" y="307" font-family="Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">A</text><line x1="280" y1="260" x2="480" y2="260" stroke="#18334c" stroke-width="6" stroke-linecap="round" /><line x1="380" y1="70" x2="380" y2="260" stroke="#18334c" stroke-width="6" stroke-linecap="round" /><text x="380" y="307" font-family="Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">B</text><line x1="510" y1="260" x2="710" y2="260" stroke="#18334c" stroke-width="6" stroke-linecap="round" /><line x1="610" y1="70" x2="610" y2="260" stroke="#18334c" stroke-width="6" stroke-linecap="round" /><text x="610" y="307" font-family="Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">C</text><rect x="62.5" y="233" width="175" height="35" rx="8" fill="#cfe7ee" stroke="#087e8b" stroke-width="2.5"/><rect x="85.0" y="191" width="130" height="35" rx="8" fill="#a5d5db" stroke="#087e8b" stroke-width="2.5"/><rect x="107.5" y="149" width="85" height="35" rx="8" fill="#68b4bf" stroke="#087e8b" stroke-width="2.5"/></svg>