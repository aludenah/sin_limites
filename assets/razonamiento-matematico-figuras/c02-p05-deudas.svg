f" font-size="32" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">B</text><circle cx="380" cy="324" r="38" fill="#e9f6f5" stroke="#087e8b" stroke-width="3"/><text x="380" y="324" font-family="Arial, sans-serif" font-size="32" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">C</text><text x="380" y="391" font-family="Arial, sans-serif" font-size="23" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">La flecha va de quien debe a quien cobra</text></svg>