<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="title desc"><title id="title">Rótulos y muestra extraída</title><desc id="desc">Tres cajas cerradas rotuladas MANZANAS, NARANJAS y MIXTA. Todos los rótulos son incorrectos. De la caja rotulada MIXTA se extrae una manzana.</desc><rect width="760" height="390" fill="#ffffff"/><rect x="40" y="160" width="190" height="140" rx="8" fill="#f5f8fb" stroke="#18334c" stroke-width="2.5"/><text x="135" y="230" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">MANZANAS</text><rect x="285" y="160" width="190" height="140" rx="8" fill="#f5f8fb" stroke="#18334c" stroke-width="2.5"/><text x="380" y="230" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">NARANJAS</text><rect x="530" y="160" width="190" height="140" rx="8" fill="#f5f8fb" stroke="#18334c" stroke-width="2.5"/><text x="625" y="230" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">MIXTA</text><circle cx="625" cy="78" r="28" fill="#d85843" stroke="#9c3829" stroke-width="3"/><line x1="625" y1="52" x2="629" y2="39" stroke="#435e35" stroke-width="4" stroke-linecap="round" /><polygon points="629,44 650,33 646,50" fill="#48815a" stroke="#48815a" stroke-width="3" stroke-linejoin="round"/><line x1="625" y1="155" x2="625" y2="116" stroke="#087e8b" stroke-width="3" stroke-linecap="round" /><polygon points="625,116 630.7531064632504,126.53099074268448 619.2468935367496,126.53099074268447" fill="#087e8b" stroke="#087e8b" stroke-width="3" stroke-linejoin="round"/><text x="380" y="343" font-family="Arial, sans-serif" font-size="25" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">Los tres rótulos son incorrectos</text></svg>