<svg xmlns="http://www.w3.org/2000/svg" width="760" height="415" viewBox="0 0 760 415" role="img" aria-labelledby="title desc"><title id="title">Cruces con una linterna</title><desc id="desc">Cuatro personas están al inicio de un puente: A tarda 1 minuto, B 2, C 5 y D 10. Pueden cruzar como máximo dos juntas y cada cruce requiere llevar la única linterna.</desc><rect width="760" height="415" fill="#ffffff"/><rect x="273" y="85" width="225" height="225" rx="0" fill="#e6f3f7" stroke="#e6f3f7" stroke-width="2.5"/><rect x="228" y="180" width="320" height="60" rx="0" fill="#efdfc8" stroke="#8c6839" stroke-width="2.5"/><circle cx="76" cy="95" r="34" fill="#e9f6f5" stroke="#087e8b" stroke-width="3"/><text x="76" y="95" font-family="Arial, sans-serif" font-size="27" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">A</text><text x="76" y="143" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">1 min</text><circle cx="192" cy="95" r="34" fill="#e9f6f5" stroke="#087e8b" stroke-width="3"/><text x="192" y="95" font-family="Arial, sans-serif" font-size="27" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">B</text><text x="192" y="143" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">2 min</text><circle cx="76" cy="303" r="34" fill="#e9f6f5" stroke="#087e8b" stroke-width="3"/><text x="76" y="303" font-family="Arial, sans-serif" font-size="27" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">C</text><text x="76" y="351" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">5 min</text><circle cx="196" cy="303" r="34" fill="#e9f6f5" stroke="#087e8b" stroke-width="3"/><text x="196" y="303" font-family="Arial, sans-serif" font-size="27" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">D</text><text x="196" y="351" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">10 min</text><text x="603" y="122" font-family="Arial, sans-serif" font-size="27" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">Destino</text><text x="400" y="36" font-family="Arial, sans-serif" font-size="26" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">Máximo dos personas por cruce</text><text x="421" y="374" font-family="Arial, sans-serif" font-size="24" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">La linterna acompaña cada cruce</text></svg>