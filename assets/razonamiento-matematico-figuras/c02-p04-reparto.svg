<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="title desc"><title id="title">Compara las masas de ambos platillos</title><desc id="desc">Todo el arroz, 20 kg, se reparte en las porciones A y B. La balanza se equilibra con A más una pesa de 4 kg en un platillo y B en el otro. Las letras representan masas de arroz, sin la pesa.</desc><rect width="760" height="350" fill="#ffffff"/><text x="380" y="34" font-family="Arial, sans-serif" font-size="26" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">Balanza en equilibrio</text><polygon points="380,120 335,310 425,310" fill="#e9f6f5" stroke="#18334c" stroke-width="3" stroke-linejoin="round"/><line x1="150" y1="110" x2="610" y2="110" stroke="#18334c" stroke-width="6" stroke-linecap="round" /><line x1="160" y1="110" x2="60" y2="250" stroke="#18334c" stroke-width="2" stroke-linecap="round" /><line x1="160" y1="110" x2="260" y2="250" stroke="#18334c" stroke-width="2" stroke-linecap="round" /><line x1="60" y1="250" x2="260" y2="250" stroke="#18334c" stroke-width="5" stroke-linecap="round" /><rect x="73.5" y="192" width="80" height="55" rx="5" fill="#e9f6f5" stroke="#087e8b" stroke-width="2.5"/><text x="113.5" y="220" font-family="Arial, sans-serif" font-size="23" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">A</text><rect x="166.5" y="192" width="80" height="55" rx="5" fill="#e9f6f5" stroke="#087e8b" stroke-width="2.5"/><text x="206.5" y="220" font-family="Arial, sans-serif" font-size="23" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">4 kg</text><line x1="600" y1="110" x2="500" y2="250" stroke="#18334c" stroke-width="2" stroke-linecap="round" /><line x1="600" y1="110" x2="700" y2="250" stroke="#18334c" stroke-width="2" stroke-linecap="round" /><line x1="500" y1="250" x2="700" y2="250" stroke="#18334c" stroke-width="5" stroke-linecap="round" /><rect x="560.0" y="192" width="80" height="55" rx="5" fill="#e9f6f5" stroke="#087e8b" stroke-width="2.5"/><text x="600.0" y="220" font-family="Arial, sans-serif" font-size="23" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">B</text></svg>