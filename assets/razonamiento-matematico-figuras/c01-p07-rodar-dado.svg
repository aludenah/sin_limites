<svg xmlns="http://www.w3.org/2000/svg" width="760" height="375" viewBox="0 0 760 375" role="img" aria-labelledby="title desc"><title id="title">Dos giros de un cuarto de vuelta</title><desc id="desc">Al inicio: arriba 1, sur 5, este 3; las opuestas son abajo 6, norte 2 y oeste 4. El recorrido tiene un paso al este y otro al norte, girando el dado sobre una arista en cada paso.</desc><rect width="760" height="375" fill="#ffffff"/><polygon points="110.0,166.75 225.0,166.75 299.75,115.0 184.75,115.0" fill="#e9f6f5" stroke="#18334c" stroke-width="3" stroke-linejoin="round"/><polygon points="110.0,166.75 225.0,166.75 225.0,281.75 110.0,281.75" fill="white" stroke="#18334c" stroke-width="3" stroke-linejoin="round"/><polygon points="225.0,166.75 299.75,115.0 299.75,230.0 225.0,281.75" fill="#d8eaf1" stroke="#18334c" stroke-width="3" stroke-linejoin="round"/><text x="204.875" y="140.875" font-family="Arial, sans-serif" font-size="34" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">1</text><text x="167.5" y="224.25" font-family="Arial, sans-serif" font-size="34" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">5</text><text x="262.375" y="198.375" font-family="Arial, sans-serif" font-size="34" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">3</text><text x="202" y="330" font-family="Arial, sans-serif" font-size="24" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">Frente: sur</text><rect x="465" y="190" width="90" height="90" rx="0" fill="#f1f8fa" stroke="#b3c5d0" stroke-width="2.5"/><rect x="575" y="190" width="90" height="90" rx="0" fill="#f1f8fa" stroke="#b3c5d0" stroke-width="2.5"/><rect x="575" y="80" width="90" height="90" rx="0" fill="#f1f8fa" stroke="#b3c5d0" stroke-width="2.5"/><line x1="510" y1="235" x2="620" y2="235" stroke="#087e8b" stroke-width="3" stroke-linecap="round" /><polygon points="620,235 609.4690092573155,240.75310646325045 609.4690092573155,229.24689353674955" fill="#087e8b" stroke="#087e8b" stroke-width="3" stroke-linejoin="round"/><line x1="620" y1="235" x2="620" y2="125" stroke="#087e8b" stroke-width="3" stroke-linecap="round" /><polygon points="620,125 625.7531064632504,135.53099074268448 614.2468935367496,135.53099074268448" fill="#087e8b" stroke="#087e8b" stroke-width="3" stroke-linejoin="round"/><text x="548" y="297" font-family="Arial, sans-serif" font-size="24" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">1.º: este</text><text x="655" y="172" font-family="Arial, sans-serif" font-size="24" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">N</text><text x="620" y="48" font-family="Arial, sans-serif" font-size="24" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">2.º: norte</text></svg>