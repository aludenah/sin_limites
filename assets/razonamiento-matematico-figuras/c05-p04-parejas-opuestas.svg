<svg xmlns="http://www.w3.org/2000/svg" width="400" height="320" viewBox="0 0 400 320" role="img" aria-labelledby="title desc"><title id="title">Números del 2 al 10</title><desc id="desc">Cuadrado mágico de tres por tres. Filas: x, 10, 5; 8, 6, 4; 7, 2, 9. Usa una vez cada entero de 2 a 10.</desc><rect width="400" height="320" fill="#ffffff"/><rect x="80.0" y="40" width="80" height="80" rx="0" fill="#e9f6f5" stroke="#18334c" stroke-width="2.5"/><text x="120.0" y="80.0" font-family="Arial, sans-serif" font-size="32" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#087e8b">x</text><rect x="160.0" y="40" width="80" height="80" rx="0" fill="white" stroke="#18334c" stroke-width="2.5"/><text x="200.0" y="80.0" font-family="Arial, sans-serif" font-size="32" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">10</text><rect x="240.0" y="40" width="80" height="80" rx="0" fill="white" stroke="#18334c" stroke-width="2.5"/><text x="280.0" y="80.0" font-family="Arial, sans-serif" font-size="32" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">5</text><rect x="80.0" y="120" width="80" height="80" rx="0" fill="white" stroke="#18334c" stroke-width="2.5"/><text x="120.0" y="160.0" font-family="Arial, sans-serif" font-size="32" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">8</text><rect x="160.0" y="120" width="80" height="80" rx="0" fill="white" stroke="#18334c" stroke-width="2.5"/><text x="200.0" y="160.0" font-family="Arial, sans-serif" font-size="32" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">6</text><rect x="240.0" y="120" width="80" height="80" rx="0" fill="white" stroke="#18334c" stroke-width="2.5"/><text x="280.0" y="160.0" font-family="Arial, sans-serif" font-size="32" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">4</text><rect x="80.0" y="200" width="80" height="80" rx="0" fill="white" stroke="#18334c" stroke-width="2.5"/><text x="120.0" y="240.0" font-family="Arial, sans-serif" font-size="32" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">7</text><rect x="160.0" y="200" width="80" height="80" rx="0" fill="white" stroke="#18334c" stroke-width="2.5"/><text x="200.0" y="240.0" font-family="Arial, sans-serif" font-size="32" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">2</text><rect x="240.0" y="200" width="80" height="80" rx="0" fill="white" stroke="#18334c" stroke-width="2.5"/><text x="280.0" y="240.0" font-family="Arial, sans-serif" font-size="32" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">9</text></svg>