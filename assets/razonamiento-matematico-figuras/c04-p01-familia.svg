<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-labelledby="title desc"><title id="title">Relaciones de filiación</title><desc id="desc">Rosa y Luis son los padres de Ana y Marco. Ana y Pedro son los padres de Elena. Marco es el padre de Tomás.</desc><rect width="760" height="450" fill="#ffffff"/><line x1="345" y1="60" x2="415" y2="60" stroke="#18334c" stroke-width="3" stroke-linecap="round" /><line x1="380" y1="60" x2="380" y2="125" stroke="#18334c" stroke-width="3" stroke-linecap="round" /><line x1="240" y1="125" x2="560" y2="125" stroke="#18334c" stroke-width="3" stroke-linecap="round" /><line x1="240" y1="125" x2="240" y2="155" stroke="#18334c" stroke-width="3" stroke-linecap="round" /><line x1="560" y1="125" x2="560" y2="155" stroke="#18334c" stroke-width="3" stroke-linecap="round" /><line x1="140" y1="190" x2="180" y2="190" stroke="#18334c" stroke-width="3" stroke-linecap="round" /><line x1="160" y1="190" x2="160" y2="295" stroke="#18334c" stroke-width="3" stroke-linecap="round" /><line x1="560" y1="225" x2="560" y2="295" stroke="#18334c" stroke-width="3" stroke-linecap="round" /><rect x="225" y="25" width="120" height="70" rx="8" fill="#e9f6f5" stroke="#087e8b" stroke-width="2.5"/><text x="285" y="60" font-family="Arial, sans-serif" font-size="25" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">Rosa</text><rect x="415" y="25" width="120" height="70" rx="8" fill="#e9f6f5" stroke="#087e8b" stroke-width="2.5"/><text x="475" y="60" font-family="Arial, sans-serif" font-size="25" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">Luis</text><rect x="20" y="155" width="120" height="70" rx="8" fill="#e9f6f5" stroke="#087e8b" stroke-width="2.5"/><text x="80" y="190" font-family="Arial, sans-serif" font-size="25" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">Pedro</text><rect x="180" y="155" width="120" height="70" rx="8" fill="#e9f6f5" stroke="#087e8b" stroke-width="2.5"/><text x="240" y="190" font-family="Arial, sans-serif" font-size="25" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">Ana</text><rect x="500" y="155" width="120" height="70" rx="8" fill="#e9f6f5" stroke="#087e8b" stroke-width="2.5"/><text x="560" y="190" font-family="Arial, sans-serif" font-size="25" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">Marco</text><rect x="100" y="295" width="120" height="70" rx="8" fill="#e9f6f5" stroke="#087e8b" stroke-width="2.5"/><text x="160" y="330" font-family="Arial, sans-serif" font-size="25" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">Elena</text><rect x="500" y="295" width="120" height="70" rx="8" fill="#e9f6f5" stroke="#087e8b" stroke-width="2.5"/><text x="560" y="330" font-family="Arial, sans-serif" font-size="25" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">Tomás</text><text x="380" y="409" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">Unión horizontal: pareja · Ramas: hijos</text></svg>