<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="title desc"><title id="title">Contacto entre monedas iguales</title><desc id="desc">Una moneda O y otra moneda A, iguales y tangentes exteriormente. Se busca completar el contorno de O.</desc><rect width="760" height="330" fill="#ffffff"/><circle cx="325" cy="170" r="62" fill="#e9f6f5" stroke="#087e8b" stroke-width="3"/><circle cx="449" cy="170" r="62" fill="#e9f6f5" stroke="#087e8b" stroke-width="3"/><text x="325" y="170" font-family="Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">O</text><text x="449" y="170" font-family="Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">A</text><text x="380" y="285" font-family="Arial, sans-serif" font-size="24" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">Monedas iguales · sin superposición</text></svg>