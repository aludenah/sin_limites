<svg xmlns="http://www.w3.org/2000/svg" width="760" height="270" viewBox="0 0 760 270" role="img" aria-labelledby="title desc"><title id="title">Desplazamientos respecto de hoy</title><desc id="desc">Línea de tiempo con anteayer menos 2, ayer menos 1, hoy 0, mañana más 1 y pasado mañana más 2. Solo se conoce que anteayer fue viernes.</desc><rect width="760" height="270" fill="#ffffff"/><line x1="90" y1="155" x2="670" y2="155" stroke="#18334c" stroke-width="3" stroke-linecap="round" /><line x1="100" y1="142" x2="100" y2="168" stroke="#087e8b" stroke-width="3" stroke-linecap="round" /><text x="100" y="59" font-family="Arial, sans-serif" font-size="23" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">Anteayer</text><text x="100" y="110" font-family="Arial, sans-serif" font-size="23" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">−2</text><text x="100" y="213" font-family="Arial, sans-serif" font-size="24" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#087e8b">viernes</text><line x1="240" y1="142" x2="240" y2="168" stroke="#087e8b" stroke-width="3" stroke-linecap="round" /><text x="240" y="59" font-family="Arial, sans-serif" font-size="23" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">Ayer</text><text x="240" y="110" font-family="Arial, sans-serif" font-size="23" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">−1</text><text x="240" y="213" font-family="Arial, sans-serif" font-size="24" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#087e8b">?</text><line x1="380" y1="142" x2="380" y2="168" stroke="#087e8b" stroke-width="3" stroke-linecap="round" /><text x="380" y="59" font-family="Arial, sans-serif" font-size="23" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">Hoy</text><text x="380" y="110" font-family="Arial, sans-serif" font-size="23" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">0</text><text x="380" y="213" font-family="Arial, sans-serif" font-size="24" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#087e8b">?</text><line x1="520" y1="142" x2="520" y2="168" stroke="#087e8b" stroke-width="3" stroke-linecap="round" /><text x="520" y="59" font-family="Arial, sans-serif" font-size="23" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">Mañana</text><text x="520" y="110" font-family="Arial, sans-serif" font-size="23" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">+1</text><text x="520" y="213" font-family="Arial, sans-serif" font-size="24" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#087e8b">?</text><line x1="660" y1="142" x2="660" y2="168" stroke="#087e8b" stroke-width="3" stroke-linecap="round" /><text x="660" y="59" font-family="Arial, sans-serif" font-size="23" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">Pasado</text><text x="660" y="110" font-family="Arial, sans-serif" font-size="23" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">+2</text><text x="660" y="213" font-family="Arial, sans-serif" font-size="24" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#087e8b">?</text><text x="660" y="83" font-family="Arial, sans-serif" font-size="23" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">mañana</text></svg>