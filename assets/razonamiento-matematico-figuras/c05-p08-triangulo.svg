<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="title desc"><title id="title">Suma de los valores de los vértices</title><desc id="desc">Triángulo con seis casillas: x, y, z en sus tres vértices y una casilla desconocida en el punto medio de cada lado. Cada lado contiene tres casillas.</desc><rect width="760" height="380" fill="#ffffff"/><line x1="380" y1="62" x2="160" y2="316" stroke="#087e8b" stroke-width="3" stroke-linecap="round" /><line x1="160" y1="316" x2="600" y2="316" stroke="#087e8b" stroke-width="3" stroke-linecap="round" /><line x1="600" y1="316" x2="380" y2="62" stroke="#087e8b" stroke-width="3" stroke-linecap="round" /><circle cx="380" cy="62" r="34" fill="#e9f6f5" stroke="#087e8b" stroke-width="3"/><text x="380" y="62" font-family="Arial, sans-serif" font-size="32" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">x</text><circle cx="160" cy="316" r="34" fill="#e9f6f5" stroke="#087e8b" stroke-width="3"/><text x="160" y="316" font-family="Arial, sans-serif" font-size="32" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">y</text><circle cx="600" cy="316" r="34" fill="#e9f6f5" stroke="#087e8b" stroke-width="3"/><text x="600" y="316" font-family="Arial, sans-serif" font-size="32" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">z</text><circle cx="270.0" cy="189.0" r="34" fill="white" stroke="#18334c" stroke-width="3"/><text x="270.0" y="189.0" font-family="Arial, sans-serif" font-size="30" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">?</text><circle cx="380.0" cy="316.0" r="34" fill="white" stroke="#18334c" stroke-width="3"/><text x="380.0" y="316.0" font-family="Arial, sans-serif" font-size="30" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">?</text><circle cx="490.0" cy="189.0" r="34" fill="white" stroke="#18334c" stroke-width="3"/><text x="490.0" y="189.0" font-family="Arial, sans-serif" font-size="30" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">?</text></svg>