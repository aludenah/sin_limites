<svg xmlns="http://www.w3.org/2000/svg" width="760" height="425" viewBox="0 0 760 425" role="img" aria-labelledby="title desc"><title id="title">Personas y capacidad de la barca</title><desc id="desc">En la orilla inicial están A de 50 kg, B de 50 kg y C de 80 kg. Una barca inicialmente en esa orilla soporta como máximo 100 kg. La orilla de destino está vacía.</desc><rect width="760" height="425" fill="#ffffff"/><rect x="310" y="30" width="210" height="285" rx="0" fill="#dff1fb" stroke="#dff1fb" stroke-width="2.5"/><text x="415" y="54" font-family="Arial, sans-serif" font-size="24" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">RÍO</text><text x="143" y="338" font-family="Arial, sans-serif" font-size="24" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">Inicio</text><text x="630" y="338" font-family="Arial, sans-serif" font-size="24" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">Destino</text><circle cx="118" cy="70" r="32" fill="#e9f6f5" stroke="#087e8b" stroke-width="3"/><text x="118" y="70" font-family="Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">A</text><text x="211" y="70" font-family="Arial, sans-serif" font-size="25" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">50 kg</text><circle cx="118" cy="157" r="32" fill="#e9f6f5" stroke="#087e8b" stroke-width="3"/><text x="118" y="157" font-family="Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">B</text><text x="211" y="157" font-family="Arial, sans-serif" font-size="25" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">50 kg</text><circle cx="118" cy="244" r="32" fill="#e9f6f5" stroke="#087e8b" stroke-width="3"/><text x="118" y="244" font-family="Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">C</text><text x="211" y="244" font-family="Arial, sans-serif" font-size="25" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">80 kg</text><polygon points="276,252 367,252 350,287 292,287" fill="#e2c99e" stroke="#8c6839" stroke-width="3" stroke-linejoin="round"/><text x="425" y="383" font-family="Arial, sans-serif" font-size="26" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">Capacidad de la barca: 100 kg</text></svg>