<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-labelledby="title desc"><title id="title">Ondas sobre la superficie del agua</title><desc id="desc">Vista superior de una perturbación central sobre agua tranquila. Los frentes circulares se extienden hacia afuera. Los círculos representan los frentes de onda, no trayectorias de las partículas de agua.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102b46"/><stop offset="1" stop-color="#174e65"/></linearGradient><linearGradient id="material" x2="0" y2="1"><stop stop-color="#fff0bc"/><stop offset=".42" stop-color="#dca665"/><stop offset="1" stop-color="#8e542b"/></linearGradient><linearGradient id="metal" x2="0" y2="1"><stop stop-color="#effaff"/><stop offset=".35" stop-color="#9fb9cb"/><stop offset=".6" stop-color="#e3f4ff"/><stop offset="1" stop-color="#53748b"/></linearGradient><radialGradient id="bead"><stop stop-color="#fff3bd"/><stop offset=".5" stop-color="#ffca67"/><stop offset="1" stop-color="#c47b32"/></radialGradient><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto-start-reverse"><path d="M0 0 7 3.5 0 7Z" fill="#62e1ce"/></marker><marker id="gold" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto-start-reverse"><path d="M0 0 6 3 0 6Z" fill="#ffce76"/></marker></defs><rect width="640" height="280" fill="url(#bg)"/><text x="320" y="33" text-anchor="middle" fill="#eaf6ff" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="600">La perturbación se extiende</text><circle cx="320" cy="151" r="107" fill="#2ca8bc" opacity=".08"/><circle cx="320" cy="151" r="25" fill="none" stroke="#79e2e7" stroke-width="4" opacity="0.95"/><circle cx="320" cy="151" r="50" fill="none" stroke="#79e2e7" stroke-width="3" opacity="0.8"/><circle cx="320" cy="151" r="75" fill="none" stroke="#79e2e7" stroke-width="3" opacity="0.65"/><circle cx="320" cy="151" r="100" fill="none" stroke="#79e2e7" stroke-width="2.5" opacity="0.45"/><circle cx="320" cy="151" r="7" fill="#d8faff"/><path d="M439 151H548" stroke="#62e1ce" stroke-width="4" marker-end="url(#arrow)"/><text x="130" y="157" text-anchor="middle" fill="#eaf6ff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="600">Fuente</text><path d="M184 150H286" stroke="#c7e9ee" stroke-width="2" stroke-dasharray="4 5"/><text x="320" y="271" text-anchor="middle" fill="#ffdb99" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="600">Vista superior de la superficie del agua</text></svg>