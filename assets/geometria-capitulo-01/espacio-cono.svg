<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-labelledby="title desc">
<title id="title">Cono circular</title><desc id="desc">Un vértice y una base circular en perspectiva. La mitad posterior del borde de la base es discontinua.</desc>
<defs>
<linearGradient id="surface" x1="0" y1=".4" x2="1" y2=".5"><stop stop-color="#5abecb" stop-opacity=".65"/><stop offset=".34" stop-color="#dcf6f8" stop-opacity=".80"/><stop offset=".58" stop-color="#b8e0ef" stop-opacity=".68"/><stop offset="1" stop-color="#8a7dd9" stop-opacity=".65"/></linearGradient>
<linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a7dce5" stop-opacity=".15"/><stop offset="1" stop-color="#627bb8" stop-opacity=".30"/></linearGradient>
<filter id="shadow" x="-25%" y="-20%" width="150%" height="155%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#3a5e96" flood-opacity=".13"/></filter>
</defs>
<g filter="url(#shadow)" stroke-linejoin="round" stroke-linecap="round">
<path d="M300 64 125.3 345.26A178 56 0 1 0 474.7 345.26Z" fill="url(#surface)"/>
<ellipse cx="300" cy="356" rx="178" ry="56" fill="url(#base)"/>
<path d="M125.3 345.26A178 56 0 0 1 474.7 345.26" fill="none" stroke="#426482" stroke-width="2.6" stroke-dasharray="8 8" opacity=".8"/>
<path d="M300 64 125.3 345.26A178 56 0 1 0 474.7 345.26Z" fill="none" stroke="#2a527f" stroke-width="4"/>
</g>
<circle cx="300" cy="64" r="5" fill="#fff" stroke="#367b99" stroke-width="2.5"/>
</svg>
