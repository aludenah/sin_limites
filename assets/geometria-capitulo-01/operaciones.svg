ound"/><text x="395.00" y="161.00" font-family="Arial,sans-serif" font-size="21" fill="#087f83" text-anchor="middle">b</text><text x="300.00" y="196.00" font-family="Arial,sans-serif" font-size="24" fill="#087f83" text-anchor="middle">AC = a + b</text><text x="26.00" y="252.00" font-family="Arial,sans-serif" font-size="19" fill="#087f83" text-anchor="start">SUSTRACCIÓN</text><path d="M65.00 315.00L535.00 315.00" fill="none" stroke="#183b50" stroke-width="2.8" stroke-linecap="round"/><circle cx="65.00" cy="315.00" r="4" fill="#183b50"/><text x="65.00" y="301.00" font-family="Georgia,serif" font-size="23" fill="#183b50" text-anchor="middle" font-style="italic">D</text><circle cx="365.00" cy="315.00" r="4" fill="#183b50"/><text x="365.00" y="301.00" font-family="Georgia,serif" font-size="23" fill="#183b50" text-anchor="middle" font-style="italic">E</text><circle cx="535.00" cy="315.00" r="4" fill="#183b50"/><text x="535.00" y="301.00" font-family="Georgia,serif" font-size="23" fill="#183b50" text-anchor="middle" font-style="italic">F</text><path d="M65.00 340.00L535.00 340.00" fill="none" stroke="#087f83" stroke-width="1.7" stroke-linecap="round"/><path d="M65.00 335.00L65.00 345.00" fill="none" stroke="#087f83" stroke-width="1.7" stroke-linecap="round"/><path d="M535.00 335.00L535.00 345.00" fill="none" stroke="#087f83" stroke-width="1.7" stroke-linecap="round"/><text x="300.00" y="366.00" font-family="Arial,sans-serif" font-size="21" fill="#087f83" text-anchor="middle">DF = d</text><text x="300.00" y="397.00" font-family="Arial,sans-serif" font-size="23" fill="#087f83" text-anchor="middle">DE = d − c   (EF = c)</text></svg>