<svg xmlns="http://www.w3.org/2000/svg" width="600" height="680" viewBox="0 0 600 680" role="img" aria-labelledby="title desc"><title id="title">La intensidad disminuye con el cuadrado de la distancia</title><desc id="desc">Una fuente puntual emite la misma potencia en todas las direcciones. Se representan dos superficies esféricas concéntricas, de radios r y2r. A distancia r, el área es S igual a4pi r cuadrado y la intensidad es I. A distancia2r, el área es4S y la intensidad I dividido entre4. Se supone propagación sin absorción.</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#fdfefb"/><stop offset="1" stop-color="#edf4ee"/></linearGradient><radialGradient id="particle" cx=".28" cy=".22"><stop stop-color="#e4fbff"/><stop offset=".4" stop-color="#5daac0"/><stop offset="1" stop-color="#286b83"/></radialGradient><radialGradient id="source" cx=".25" cy=".2"><stop stop-color="#fff5c9"/><stop offset=".4" stop-color="#e0b556"/><stop offset="1" stop-color="#9a7436"/></radialGradient><linearGradient id="metal"><stop stop-color="#537079"/><stop offset=".25" stop-color="#c9dadb"/><stop offset=".6" stop-color="#869fa4"/><stop offset="1" stop-color="#405b65"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#347e7b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrowgold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#9d7836" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><style>text{font-family:Inter,Arial,sans-serif;fill:#294e57;text-anchor:middle}.main{font-size:36px;font-weight:650}.sub{font-size:32px}.small{font-size:30px}.teal{fill:#267b7c}.gold{fill:#936c2c}</style><rect width="600" height="680" fill="url(#bg)"/><text class="main" x="300" y="44">Potencia P constante</text><circle cx="300" cy="290" r="216" fill="#6faab1" fill-opacity=".035" stroke="#6caaa7" stroke-width="2.2"/><circle cx="300" cy="290" r="108" fill="#66ad9e" fill-opacity=".09" stroke="#267b7c" stroke-width="2.6"/><path d="M320.48 304.34L467.93 407.58" fill="none" stroke="#8eafa6" stroke-width="1.5" marker-end="url(#arrow)" opacity=".6"/><path d="M275.38 294.34L98.11 325.60" fill="none" stroke="#8eafa6" stroke-width="1.5" marker-end="url(#arrow)" opacity=".6"/><path d="M279.52 275.66L132.07 172.42" fill="none" stroke="#8eafa6" stroke-width="1.5" marker-end="url(#arrow)" opacity=".6"/><path d="M293.53 265.85L246.94 91.99" fill="none" stroke="#8eafa6" stroke-width="1.5" marker-end="url(#arrow)" opacity=".6"/><path d="M316.07 270.85L431.77 132.96" fill="none" stroke="#8eafa6" stroke-width="1.5" marker-end="url(#arrow)" opacity=".6"/><path d="M320 290H404" fill="none" stroke="#347e7b" stroke-width="2" marker-end="url(#arrow)"/><text class="main teal" x="357" y="272">r</text><path d="M300 270V78" fill="none" stroke="#9d7836" stroke-width="2" marker-end="url(#arrowgold)"/><text class="main gold" x="334" y="163">2r</text><circle cx="300" cy="290" r="17" fill="url(#source)" stroke="#a17b35" stroke-width="1.3"/><text class="sub" x="300" y="346">Fuente</text><rect x="35" y="527" width="254" height="136" rx="15" fill="#fff" stroke="#d6e5de"/><rect x="311" y="527" width="254" height="136" rx="15" fill="#fff" stroke="#d6e5de"/><text class="main teal" x="162" y="566">r</text><text class="sub" x="162" y="608">S = 4πr²</text><text class="sub teal" x="162" y="649">Intensidad I</text><text class="main gold" x="438" y="566">2r</text><text class="sub" x="438" y="608">Área 4S</text><text class="sub gold" x="438" y="649">Intensidad I/4</text></svg>