<svg xmlns="http://www.w3.org/2000/svg" width="760" height="940" viewBox="0 0 760 940" role="img" aria-labelledby="title desc">
<title id="title">Mapa conceptual de las magnitudes físicas</title><desc id="desc">Las magnitudes físicas son propiedades medibles. Por su origen, son fundamentales o derivadas; por su naturaleza, escalares o vectoriales. El análisis dimensional relaciona sus dimensiones. En una suma o resta físicamente válida todos los términos tienen la misma dimensión.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#0b7f84" stroke-width="2" stroke-linejoin="round"/></marker></defs>
<rect width="760" height="940" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="380" y="43" font-size="29" fill="#142d4e" text-anchor="middle" font-weight="bold">Mapa de las magnitudes físicas</text><rect x="174" y="74" width="412" height="82" rx="13" fill="white" stroke="#0b7f84" stroke-width="2.5"/><text x="380" y="108" font-size="27" fill="#142d4e" text-anchor="middle" font-weight="bold">Magnitudes físicas</text><text x="380" y="139" font-size="22" fill="#142d4e" text-anchor="middle" font-weight="normal">Propiedades que pueden medirse</text><line x1="380" y1="156" x2="380" y2="183" stroke="#0b7f84" stroke-width="2.5" /><line x1="198" y1="183" x2="562" y2="183" stroke="#0b7f84" stroke-width="2.5" /><line x1="198" y1="183" x2="198" y2="207" stroke="#0b7f84" stroke-width="2.5" /><line x1="562" y1="183" x2="562" y2="207" stroke="#0b7f84" stroke-width="2.5" /><rect x="56" y="207" width="292" height="52" rx="8" fill="white" stroke="#0b7f84" stroke-width="2.5"/><text x="202" y="241" font-size="22" fill="#0b7f84" text-anchor="middle" font-weight="bold">POR SU ORIGEN</text><rect x="412" y="207" width="292" height="52" rx="8" fill="white" stroke="#0b7f84" stroke-width="2.5"/><text x="558" y="241" font-size="22" fill="#0b7f84" text-anchor="middle" font-weight="bold">POR SU NATURALEZA</text><line x1="202" y1="259" x2="202" y2="276" stroke="#0b7f84" stroke-width="2.5" /><line x1="41" y1="276" x2="202" y2="276" stroke="#0b7f84" stroke-width="2.5" /><line x1="41" y1="276" x2="41" y2="492" stroke="#0b7f84" stroke-width="2.5" /><line x1="41" y1="345" x2="67" y2="345" stroke="#0b7f84" stroke-width="2.5" /><line x1="41" y1="492" x2="67" y2="492" stroke="#0b7f84" stroke-width="2.5" /><line x1="559" y1="259" x2="559" y2="276" stroke="#0b7f84" stroke-width="2.5" /><line x1="398" y1="276" x2="559" y2="276" stroke="#0b7f84" stroke-width="2.5" /><line x1="398" y1="276" x2="398" y2="492" stroke="#0b7f84" stroke-width="2.5" /><line x1="398" y1="345" x2="424" y2="345" stroke="#0b7f84" stroke-width="2.5" /><line x1="398" y1="492" x2="424" y2="492" stroke="#0b7f84" stroke-width="2.5" /><rect x="67" y="297" width="274" height="116" rx="8" fill="white" stroke="#d9e2ea" stroke-width="2.5"/><text x="204" y="329" font-size="24" fill="#142d4e" text-anchor="middle" font-weight="bold">Fundamentales</text><text x="204" y="364" font-size="20" fill="#142d4e" text-anchor="middle" font-weight="normal">Son la base del SI.</text><text x="204" y="393" font-size="20" fill="#142d4e" text-anchor="middle" font-weight="normal">Longitud, masa, tiempo…</text><rect x="67" y="443" width="274" height="116" rx="8" fill="white" stroke="#d9e2ea" stroke-width="2.5"/><text x="204" y="475" font-size="24" fill="#142d4e" text-anchor="middle" font-weight="bold">Derivadas</text><text x="204" y="510" font-size="20" fill="#142d4e" text-anchor="middle" font-weight="normal">Combinan magnitudes.</text><text x="204" y="539" font-size="20" fill="#142d4e" text-anchor="middle" font-weight="normal">Velocidad, fuerza, área…</text><rect x="424" y="297" width="274" height="116" rx="8" fill="white" stroke="#d9e2ea" stroke-width="2.5"/><text x="561" y="329" font-size="24" fill="#142d4e" text-anchor="middle" font-weight="bold">Escalares</text><text x="561" y="364" font-size="20" fill="#142d4e" text-anchor="middle" font-weight="normal">Valor y unidad.</text><text x="561" y="393" font-size="20" fill="#142d4e" text-anchor="middle" font-weight="normal">Masa, tiempo, energía…</text><rect x="424" y="443" width="274" height="116" rx="8" fill="white" stroke="#d9e2ea" stroke-width="2.5"/><text x="561" y="475" font-size="24" fill="#142d4e" text-anchor="middle" font-weight="bold">Vectoriales</text><text x="561" y="510" font-size="20" fill="#142d4e" text-anchor="middle" font-weight="normal">Valor, unidad y dirección.</text><text x="561" y="539" font-size="20" fill="#142d4e" text-anchor="middle" font-weight="normal">Velocidad, fuerza…</text><rect x="140" y="611" width="480" height="58" rx="8" fill="white" stroke="#0b7f84" stroke-width="2.5"/><text x="380" y="648" font-size="24" fill="#0b7f84" text-anchor="middle" font-weight="bold">ANÁLISIS DIMENSIONAL</text><line x1="202" y1="559" x2="202" y2="586" stroke="#0b7f84" stroke-width="2.5" /><line x1="558" y1="559" x2="558" y2="586" stroke="#0b7f84" stroke-width="2.5" /><line x1="202" y1="586" x2="558" y2="586" stroke="#0b7f84" stroke-width="2.5" /><line x1="380" y1="586" x2="380" y2="611" stroke="#0b7f84" stroke-width="2.5" /><text x="380" y="708" font-size="24" fill="#142d4e" text-anchor="middle" font-weight="normal">Relaciona las dimensiones de las magnitudes.</text><text x="380" y="754" font-size="28" fill="#142d4e" text-anchor="middle" font-weight="bold">[v] = L T⁻¹         [F] = M L T⁻²</text><line x1="60" y1="784" x2="700" y2="784" stroke="#d9e2ea" stroke-width="1.5" /><text x="380" y="828" font-size="26" fill="#0b7f84" text-anchor="middle" font-weight="bold">Principio de homogeneidad</text><text x="380" y="870" font-size="24" fill="#142d4e" text-anchor="middle" font-weight="normal">Los términos que se suman o restan</text><text x="380" y="905" font-size="24" fill="#142d4e" text-anchor="middle" font-weight="normal">deben tener la misma dimensión.</text></g></svg>