<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title desc">
<title id="title">Suma de longitudes y principio de homogeneidad</title><desc id="desc">Ocho metros más cien centímetros son nueve metros. Cien centímetros equivalen a un metro. Las barras usan la misma escala de longitud. Los tres términos tienen dimensión longitud L.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#0b7f84" stroke-width="2" stroke-linejoin="round"/></marker></defs>
<rect width="760" height="500" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="380" y="43" font-size="29" fill="#142d4e" text-anchor="middle" font-weight="bold">Homogeneidad dimensional</text><text x="380" y="96" font-size="37" fill="#0b7f84" text-anchor="middle" font-weight="bold">8 m + 100 cm = 9 m</text><text x="380" y="137" font-size="25" fill="#67788b" text-anchor="middle" font-weight="normal">Primero: 100 cm = 1 m</text><rect x="78" y="177" width="480" height="41" rx="0" fill="white" stroke="#0b7f84" stroke-width="2.5"/><rect x="572" y="177" width="60" height="41" rx="0" fill="white" stroke="#0b7f84" stroke-width="2.5"/><text x="318" y="204" font-size="23" fill="#0b7f84" text-anchor="middle" font-weight="normal">8 m</text><text x="602" y="204" font-size="20" fill="#0b7f84" text-anchor="middle" font-weight="normal">1 m</text><rect x="78" y="256" width="540" height="41" rx="0" fill="white" stroke="#0b7f84" stroke-width="2.5"/><text x="348" y="284" font-size="23" fill="#0b7f84" text-anchor="middle" font-weight="normal">9 m</text><text x="680" y="205" font-size="20" fill="#67788b" text-anchor="middle" font-weight="normal">Suma</text><text x="681" y="285" font-size="20" fill="#67788b" text-anchor="middle" font-weight="normal">Total</text><line x1="40" y1="331" x2="720" y2="331" stroke="#d9e2ea" stroke-width="1.5" /><text x="380" y="377" font-size="30" fill="#142d4e" text-anchor="middle" font-weight="bold">[8 m] = [100 cm] = [9 m] = L</text><text x="380" y="423" font-size="22" fill="#67788b" text-anchor="middle" font-weight="normal">Se suman longitudes: todos los términos tienen dimensión L.</text><text x="380" y="467" font-size="21" fill="#67788b" text-anchor="middle" font-weight="normal">Las dimensiones no se suman como números.</text></g></svg>