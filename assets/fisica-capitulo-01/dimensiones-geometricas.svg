<svg xmlns="http://www.w3.org/2000/svg" width="760" height="665" viewBox="0 0 760 665" role="img" aria-labelledby="title desc">
<title id="title">Área y volumen a partir de longitudes</title><desc id="desc">Un rectángulo de base b y altura h tiene área A igual a b por h y dimensión L al cuadrado. Un prisma de base rectangular con longitudes b, h y l tiene volumen b por h por l y dimensión L al cubo.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#0b7f84" stroke-width="2" stroke-linejoin="round"/></marker></defs>
<rect width="760" height="665" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="380" y="43" font-size="29" fill="#142d4e" text-anchor="middle" font-weight="bold">Dimensiones del área y el volumen</text><text x="188" y="101" font-size="24" fill="#142d4e" text-anchor="middle" font-weight="bold">Área de un rectángulo</text><rect x="90" y="137" width="205" height="125" rx="0" fill="white" stroke="#0b7f84" stroke-width="2.5"/><line x1="90" y1="283" x2="295" y2="283" stroke="#67788b" stroke-width="1.5" /><line x1="90" y1="276" x2="90" y2="290" stroke="#67788b" stroke-width="2.5" /><line x1="295" y1="276" x2="295" y2="290" stroke="#67788b" stroke-width="2.5" /><text x="192" y="315" font-size="26" fill="#0b7f84" text-anchor="middle" font-weight="normal">b</text><text x="66" y="208" font-size="26" fill="#0b7f84" text-anchor="middle" font-weight="normal">h</text><text x="540" y="168" font-size="31" fill="#142d4e" text-anchor="middle" font-weight="bold">A = b · h</text><text x="540" y="214" font-size="28" fill="#142d4e" text-anchor="middle" font-weight="normal">[A] = L · L</text><text x="540" y="267" font-size="33" fill="#0b7f84" text-anchor="middle" font-weight="bold">[A] = L²</text><line x1="40" y1="350" x2="720" y2="350" stroke="#d9e2ea" stroke-width="1.5" /><text x="188" y="401" font-size="24" fill="#142d4e" text-anchor="middle" font-weight="bold">Volumen de un prisma</text><path d="M90 493 H225 V589 H90 Z M90 493 L164 439 H299 V535 L225 589 M225 493 L299 439" stroke="#0b7f84" stroke-width="2.5" fill="none" /><path d="M164 439 V535 H299 M164 535 L90 589" stroke="#67788b" stroke-width="1.5" fill="none" stroke-dasharray="6 7"/><text x="152" y="623" font-size="26" fill="#0b7f84" text-anchor="middle" font-weight="normal">b</text><text x="313" y="490" font-size="26" fill="#0b7f84" text-anchor="middle" font-weight="normal">h</text><text x="286" y="586" font-size="26" fill="#0b7f84" text-anchor="middle" font-weight="normal">l</text><text x="540" y="465" font-size="31" fill="#142d4e" text-anchor="middle" font-weight="bold">V = b · h · l</text><text x="540" y="515" font-size="28" fill="#142d4e" text-anchor="middle" font-weight="normal">[V] = L · L · L</text><text x="540" y="573" font-size="33" fill="#0b7f84" text-anchor="middle" font-weight="bold">[V] = L³</text></g></svg>