<svg xmlns="http://www.w3.org/2000/svg" width="760" height="805" viewBox="0 0 760 805" role="img" aria-labelledby="title desc">
<title id="title">Relaciones de fuerza, presión, trabajo y potencia</title><desc id="desc">Fuerza: masa por aceleración. Presión: fuerza perpendicular repartida sobre un área. Trabajo: fuerza constante paralela al desplazamiento por la distancia. Potencia media: trabajo dividido entre el intervalo de tiempo empleado.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#0b7f84" stroke-width="2" stroke-linejoin="round"/></marker></defs>
<rect width="760" height="805" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="380" y="43" font-size="29" fill="#142d4e" text-anchor="middle" font-weight="bold">Magnitudes derivadas</text><line x1="380" y1="83" x2="380" y2="738" stroke="#d9e2ea" stroke-width="1.5" /><line x1="40" y1="405" x2="720" y2="405" stroke="#d9e2ea" stroke-width="1.5" /><text x="190" y="106" font-size="25" fill="#142d4e" text-anchor="middle" font-weight="bold">Fuerza</text><rect x="92" y="163" width="82" height="62" rx="3" fill="white" stroke="#142d4e" stroke-width="2.5"/><text x="133" y="202" font-size="26" fill="#142d4e" text-anchor="middle" font-weight="normal">m</text><line x1="60" y1="225" x2="319" y2="225" stroke="#142d4e" stroke-width="2.5" /><line x1="175" y1="185" x2="298" y2="185" stroke="#0b7f84" stroke-width="3" marker-end="url(#arrow)"/><text x="275" y="172" font-size="24" fill="#0b7f84" text-anchor="middle" font-weight="normal">F</text><line x1="190" y1="141" x2="275" y2="141" stroke="#0b7f84" stroke-width="3" marker-end="url(#arrow)"/><text x="233" y="125" font-size="22" fill="#0b7f84" text-anchor="middle" font-weight="normal">a</text><text x="190" y="290" font-size="29" fill="#142d4e" text-anchor="middle" font-weight="normal">F = m · a</text><text x="190" y="337" font-size="28" fill="#0b7f84" text-anchor="middle" font-weight="normal">[F] = M L T⁻²</text><text x="570" y="106" font-size="25" fill="#142d4e" text-anchor="middle" font-weight="bold">Presión</text><path d="M457 225 H636 L680 188 H501 Z" stroke="#142d4e" stroke-width="2.5" fill="white" /><line x1="570" y1="137" x2="570" y2="203" stroke="#0b7f84" stroke-width="3" marker-end="url(#arrow)"/><text x="594" y="166" font-size="24" fill="#0b7f84" text-anchor="middle" font-weight="normal">F</text><text x="570" y="247" font-size="22" fill="#142d4e" text-anchor="middle" font-weight="normal">Área A</text><text x="570" y="290" font-size="29" fill="#142d4e" text-anchor="middle" font-weight="normal">p = F / A</text><text x="570" y="337" font-size="28" fill="#0b7f84" text-anchor="middle" font-weight="normal">[p] = M L⁻¹ T⁻²</text><text x="190" y="450" font-size="25" fill="#142d4e" text-anchor="middle" font-weight="bold">Trabajo mecánico</text><rect x="63" y="496" width="59" height="55" rx="3" fill="white" stroke="#142d4e" stroke-width="2.5"/><rect x="264" y="496" width="59" height="55" rx="3" fill="white" stroke="#d9e2ea" stroke-width="2.5"/><line x1="49" y1="554" x2="337" y2="554" stroke="#142d4e" stroke-width="2.5" /><line x1="122" y1="519" x2="232" y2="519" stroke="#0b7f84" stroke-width="3" marker-end="url(#arrow)"/><text x="180" y="500" font-size="24" fill="#0b7f84" text-anchor="middle" font-weight="normal">F</text><line x1="93" y1="582" x2="293" y2="582" stroke="#0b7f84" stroke-width="3" marker-end="url(#arrow)"/><text x="190" y="610" font-size="24" fill="#0b7f84" text-anchor="middle" font-weight="normal">d</text><text x="190" y="663" font-size="29" fill="#142d4e" text-anchor="middle" font-weight="normal">W = F · d</text><text x="190" y="706" font-size="28" fill="#0b7f84" text-anchor="middle" font-weight="normal">[W] = M L² T⁻²</text><text x="570" y="450" font-size="25" fill="#142d4e" text-anchor="middle" font-weight="bold">Potencia</text><circle cx="570" cy="510" r="31" stroke="#142d4e" stroke-width="2.5" fill="white"/><path d="M539 510 V578 M601 510 V578" stroke="#142d4e" stroke-width="2.5" fill="none" /><rect x="519" y="578" width="40" height="36" rx="3" fill="white" stroke="#142d4e" stroke-width="2.5"/><line x1="637" y1="579" x2="637" y2="512" stroke="#0b7f84" stroke-width="3" marker-end="url(#arrow)"/><text x="665" y="549" font-size="23" fill="#0b7f84" text-anchor="middle" font-weight="normal">h</text><text x="570" y="663" font-size="29" fill="#142d4e" text-anchor="middle" font-weight="normal">P = W / Δt</text><text x="570" y="706" font-size="28" fill="#0b7f84" text-anchor="middle" font-weight="normal">[P] = M L² T⁻³</text><text x="380" y="777" font-size="22" fill="#67788b" text-anchor="middle" font-weight="normal">En el trabajo representado, F es constante y paralela a d.</text></g></svg>