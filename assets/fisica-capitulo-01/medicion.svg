<svg xmlns="http://www.w3.org/2000/svg" width="760" height="760" viewBox="0 0 760 760" role="img" aria-labelledby="title desc">
<title id="title">Valor numérico y unidad de una medición</title><desc id="desc">Una balanza compara una masa de dos kilogramos. Una regla mide una longitud de diez centímetros. Un cronómetro mide quince segundos. Cada medida contiene un valor numérico y una unidad.</desc>
