<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600" role="img" aria-labelledby="title desc">
<title id="title">Ejemplos de fenómenos físicos</title><desc id="desc">El hielo se transforma en agua líquida; un resorte se alarga al colgar una carga; un rayo de luz se refleja en un espejo. Estos cambios no alteran la composición química de la sustancia.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#0b7f84" stroke-width="2" stroke-linejoin="round"/></marker></defs>
<rect width="760" height="600" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="380" y="43" font-size="29" fill="#142d4e" text-anchor="middle" font-weight="bold">Fenómenos físicos</text><text x="195" y="94" font-size="25" fill="#142d4e" text-anchor="middle" font-weight="bold">Fusión del hielo</text><text x="565" y="94" font-size="23" fill="#142d4e" text-anchor="middle" font-weight="bold">Deformación de un resorte</text><path d="M50 130 V218 Q50 232 65 232 H135 Q150 232 150 218 V130" stroke="#142d4e" stroke-width="2.5" fill="none" /><rect x="79" y="173" width="48" height="43" rx="0" fill="white" stroke="#0b7f84" stroke-width="2.5"/><path d="M250 130 V218 Q250 232 265 232 H335 Q350 232 350 218 V130" stroke="#142d4e" stroke-width="2.5" fill="none" /><path d="M251 192 Q267 186 284 192 T317 192 T349 192" stroke="#0b7f84" stroke-width="2.5" fill="none" /><line x1="170" y1="178" x2="230" y2="178" stroke="#0b7f84" stroke-width="3" marker-end="url(#arrow)"/><text x="100" y="265" font-size="23" fill="#142d4e" text-anchor="middle" font-weight="normal">Hielo</text><text x="300" y="265" font-size="23" fill="#142d4e" text-anchor="middle" font-weight="normal">Agua</text><text x="200" y="303" font-size="21" fill="#67788b" text-anchor="middle" font-weight="normal">La sustancia sigue siendo agua.</text><line x1="405" y1="123" x2="716" y2="123" stroke="#142d4e" stroke-width="2.5" /><path d="M460 123 V139 l-13 8 26 9 -26 9 26 9 -26 9 26 9 -13 8 V215" stroke="#142d4e" stroke-width="2.5" fill="none" /><path d="M640 123 V139 l-13 14 26 15 -26 15 26 15 -26 15 26 15 -13 14 V257" stroke="#142d4e" stroke-width="2.5" fill="none" /><rect x="620" y="257" width="40" height="32" rx="0" fill="white" stroke="#142d4e" stroke-width="2.5"/><text x="460" y="303" font-size="21" fill="#67788b" text-anchor="middle" font-weight="normal">Sin carga</text><text x="640" y="330" font-size="21" fill="#67788b" text-anchor="middle" font-weight="normal">Con carga</text><line x1="40" y1="350" x2="720" y2="350" stroke="#d9e2ea" stroke-width="1.5" /><text x="380" y="389" font-size="25" fill="#142d4e" text-anchor="middle" font-weight="bold">Reflexión de la luz</text><line x1="160" y1="565" x2="600" y2="565" stroke="#142d4e" stroke-width="4" /><line x1="380" y1="430" x2="380" y2="565" stroke="#67788b" stroke-width="1.5" stroke-dasharray="7 7"/><line x1="250" y1="430" x2="380" y2="565" stroke="#0b7f84" stroke-width="3" marker-end="url(#arrow)"/><line x1="380" y1="565" x2="510" y2="430" stroke="#0b7f84" stroke-width="3" marker-end="url(#arrow)"/><text x="230" y="416" font-size="22" fill="#142d4e" text-anchor="middle" font-weight="normal">Rayo incidente</text><text x="530" y="416" font-size="22" fill="#142d4e" text-anchor="middle" font-weight="normal">Rayo reflejado</text><text x="651" y="570" font-size="20" fill="#142d4e" text-anchor="middle" font-weight="normal">Espejo</text></g></svg>