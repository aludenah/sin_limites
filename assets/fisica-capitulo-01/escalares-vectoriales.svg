<svg xmlns="http://www.w3.org/2000/svg" width="760" height="465" viewBox="0 0 760 465" role="img" aria-labelledby="title desc">
<title id="title">Comparación entre rapidez y velocidad</title><desc id="desc">Dos esferas se mueven con rapidez de veinte metros por segundo. Una va a la derecha y otra a la izquierda. Sus velocidades son diferentes porque tienen sentidos opuestos.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#0b7f84" stroke-width="2" stroke-linejoin="round"/></marker></defs>
<rect width="760" height="465" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="380" y="43" font-size="29" fill="#142d4e" text-anchor="middle" font-weight="bold">Rapidez y velocidad</text><text x="380" y="86" font-size="24" fill="#67788b" text-anchor="middle" font-weight="normal">La rapidez es escalar; la velocidad es vectorial.</text><circle cx="160" cy="168" r="27" stroke="#142d4e" stroke-width="2.5" fill="white"/><line x1="202" y1="168" x2="423" y2="168" stroke="#0b7f84" stroke-width="3" marker-end="url(#arrow)"/><text x="542" y="159" font-size="30" fill="#0b7f84" text-anchor="middle" font-weight="bold">20 m/s</text><text x="542" y="195" font-size="23" fill="#142d4e" text-anchor="middle" font-weight="normal">hacia la derecha</text><circle cx="420" cy="284" r="27" stroke="#142d4e" stroke-width="2.5" fill="white"/><line x1="376" y1="284" x2="156" y2="284" stroke="#0b7f84" stroke-width="3" marker-end="url(#arrow)"/><text x="542" y="275" font-size="30" fill="#0b7f84" text-anchor="middle" font-weight="bold">20 m/s</text><text x="542" y="312" font-size="23" fill="#142d4e" text-anchor="middle" font-weight="normal">hacia la izquierda</text><line x1="50" y1="352" x2="710" y2="352" stroke="#d9e2ea" stroke-width="1.5" /><text x="380" y="393" font-size="26" fill="#142d4e" text-anchor="middle" font-weight="bold">Igual rapidez, distintas velocidades.</text><text x="380" y="433" font-size="23" fill="#67788b" text-anchor="middle" font-weight="normal">En la velocidad también importa hacia dónde se mueve.</text></g></svg>