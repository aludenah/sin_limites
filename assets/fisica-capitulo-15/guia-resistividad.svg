<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350" viewBox="0 0 800 350" role="img" aria-labelledby="title desc"><title id="title">Longitud, sección y resistividad</title><desc id="desc">Conductor uniforme de longitud 10 m y área transversal 2 milímetros cuadrados. La resistividad es 1,6 por 10 elevado a menos 8 ohmios metro. El dibujo no está a escala.</desc><rect width="800" height="350" fill="#ffffff"/><rect x="150" y="150" width="490" height="80" fill="#eaf6f6" stroke="#087e8b" stroke-width="2.5"/><ellipse cx="150" cy="190" rx="16" ry="40" fill="white" stroke="#087e8b" stroke-width="2.5"/><ellipse cx="640" cy="190" rx="16" ry="40" fill="white" stroke="#087e8b" stroke-width="2.5"/><line x1="150" y1="95" x2="640" y2="95" stroke="#18334c" stroke-width="3" stroke-linecap="round" /><line x1="150" y1="83" x2="150" y2="107" stroke="#18334c" stroke-width="3" stroke-linecap="round" /><line x1="640" y1="83" x2="640" y2="107" stroke="#18334c" stroke-width="3" stroke-linecap="round" /><text x="395" y="61" font-family="Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">L = 10 m</text><text x="670" y="190" font-family="Arial, sans-serif" font-size="27" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">A</text><text x="400" y="285" font-family="Arial, sans-serif" font-size="27" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">A = 2 mm² · ρ = 1,6 × 10⁻⁸ Ω·m</text></svg>