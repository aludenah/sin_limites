<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">Un resistor en serie con dos ramas en paralelo</title><desc id="desc">Fuente ideal de 24 V, positiva arriba. Un resistor de 4 ohmios conecta la fuente al nodo A. Entre A y B hay dos ramas en paralelo, de 12 y 6 ohmios. B vuelve al terminal negativo. I1 e I2 se indican de A hacia B.</desc><rect width="800" height="400" fill="#ffffff"/><line x1="125" y1="160" x2="125" y2="90" stroke="#18334c" stroke-width="3" stroke-linecap="round" /><line x1="125" y1="160" x2="125" y2="196" stroke="#18334c" stroke-width="3" stroke-linecap="round" /><line x1="101" y1="196" x2="149" y2="196" stroke="#18334c" stroke-width="4" stroke-linecap="round" /><line x1="113" y1="214" x2="137" y2="214" stroke="#18334c" stroke-width="4" stroke-linecap="round" /><line x1="125" y1="214" x2="125" y2="250" stroke="#18334c" stroke-width="3" stroke-linecap="round" /><text x="165" y="191" font-family="Arial, sans-serif" font-size="24" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#087e8b">+</text><text x="165" y="222" font-family="Arial, sans-serif" font-size="24" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#087e8b">−</text><text x="85" y="205" font-family="Arial, sans-serif" font-size="26" font-weight="600" text-anchor="end" dominant-baseline="middle" fill="#18334c">24 V</text><line x1="125" y1="250" x2="125" y2="340" stroke="#18334c" stroke-width="3" stroke-linecap="round" /><line x1="125" y1="90" x2="230" y2="90" stroke="#18334c" stroke-width="3" stroke-linecap="round" /><line x1="230" y1="90" x2="260" y2="90" stroke="#18334c" stroke-width="3" stroke-linecap="round" /><polyline points="260,90 268,78 276,102 284,78 292,102 300,78 308,102 316,78 324,102 332,78 340,90" fill="none" stroke="#18334c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="340" y1="90" x2="370" y2="90" stroke="#