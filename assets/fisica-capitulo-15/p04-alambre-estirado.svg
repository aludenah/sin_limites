<svg xmlns="http://www.w3.org/2000/svg" width="800" height="415" viewBox="0 0 800 415" role="img" aria-labelledby="title desc"><title id="title">Estiramiento uniforme de un conductor</title><desc id="desc">Antes: conductor de longitud 5 m y sección 0,50 milímetros cuadrados. Después del estiramiento uniforme: longitud 10 m y sección desconocida. Se conserva el volumen y la resistividad permanece constante.</desc><rect width="800" height="415" fill="#ffffff"/><rect x="130" y="100" width="240" height="64" fill="#eaf6f6" stroke="#087e8b" stroke-width="2.5"/><ellipse cx="130" cy="132" rx="13" ry="32" fill="white" stroke="#087e8b" stroke-width="2.5"/><ellipse cx="370" cy="132" rx="13" ry="32" fill="white" stroke="#087e8b" stroke-width="2.5"/><text x="250" y="57" font-family="Arial, sans-serif" font-size="26" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">Antes: L = 5 m</text><text x="505" y="132" font-family="Arial, sans-serif" font-size="25" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">A = 0,50 mm²</text><rect x="130" y="267" width="480" height="45.2548" fill="#eaf6f6" stroke="#087e8b" stroke-width="2.5"/><ellipse cx="130" cy="289.6274" rx="9.1924" ry="22.6274" fill="white" stroke="#087e8b" stroke-width="2.5"/><ellipse cx="610" cy="289.6274" rx="9.1924" ry="22.6274" fill="white" stroke="#087e8b" stroke-width="2.5"/><text x="365" y="226" font-family="Arial, sans-serif" font-size="26" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">Después: L′ = 10 m</text><text x="665" y="288" font-family="Arial, sans-serif" font-size="25" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">A′ = ?</text><text x="400" y="368" font-family="Arial, sans-serif" font-size="26" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#18334c">Mismo volumen · Misma resistividad</text></svg>