<svg xmlns="http://www.w3.org/2000/svg" width="860" height="425" viewBox="0 0 860 425" role="img" aria-labelledby="title desc"><title id="title">Un puente conductor y dos instrumentos ideales</title><desc id="desc">Fuente ideal de 18 V, con positivo arriba. En la rama superior hay resistores de 3 ohmios y 9 ohmios; un cable ideal une directamente ambos terminales del resistor de 9 ohmios. A continuación hay un resistor de 6 ohmios en la rama derecha. Un amperímetro ideal está en el retorno inferior y un voltímetro ideal está en paralelo con el resistor de 6 ohmios.</desc><rect width="860" height="425" fill="#ffffff"/><line x1="120" y1="190" x2="120" y2="226" stroke="#18334c" stroke-width="3" stroke-linecap="round" /><line x1="96" y1="226" x2="144" y2="226" stroke="#18334c" stroke-width="4" stroke-linecap="round" /><line x1="108" y1="244" x2="132" y2="244" stroke="#18334c" stroke-width="4" stroke-linecap="round" /><line x1="120" y1="244" x2="120" y2="280" stroke="#18334c" stroke-width="3" stroke-linecap="round" /><text x="160" y="221" font-family="Arial, sans-serif" font-size="24" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#087e8b">+</text><text x="160" y="252" font-family="Arial, sans-serif" font-size="24" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#087e8b">−</text><text x="80" y="235" font-family="Arial, sans-serif" font-size="26" font-weight="600" text-anchor="end" dominant-baseline="middle" fill="#18334c">18 V</text><line x1="120" y1="190" x2="120" y2="125" stroke="#18334c" stroke-width="3" stroke-linecap="round" /><line x1="120" y1="280" x2="120" y2="350" stroke="#18334c" stroke-width="3" stroke-linecap="round" /><line x1="120" y1="125" x2="195" y2="125" stroke="#18334c" stroke-width="3" stroke-linecap="round" /><line x1="195" y1="125" x2="225" y2="125" stroke="#18334c" stroke-width="3" stroke-linecap="round" /><polyline points="225,125 233,113 241,137 249,113 257,137 265,113 273,137 281,113 289,137 297,1