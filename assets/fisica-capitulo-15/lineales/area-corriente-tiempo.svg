<line x1="334" y1="93" x2="334" y2="285" stroke-dasharray="7 7"/>
<text x="334" y="321" fill="#172630" stroke="none" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" text-anchor="middle">t₂</text>
