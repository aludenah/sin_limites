  <pattern id="hatch2" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M0,0 L16,16" fill="none" stroke="#172630" stroke-width="1"/></pattern>
</defs>
<rect id="background" width="750" height="350" fill="#ffffff"/>
<g fill="none" stroke="#172630" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
<style>text{fill:#172630;stroke:none;font-family:'DejaVu Sans',Arial,sans-serif}</style>
<line x1="92" y1="285" x2="92" y2="44"/>
<path d="M92,44 L87.80,54.00 L96.20,54.00 Z" fill="#172630" stroke="none"/>
<line x1="92" y1="285" x2="463" y2="285"/>
