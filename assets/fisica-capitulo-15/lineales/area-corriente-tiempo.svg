<text x="54" y="41" fill="#172630" stroke="none" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" text-anchor="middle">I (A)</text>
<text x="490" y="313" fill="#172630" stroke="none" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" text-anchor="middle">t (s)</text>
<path d="M180,285 L180,162 C218,105 278,165 334,93 L334,285 Z" fill="url(#hatch)"/>
<path d="M112,196 C134,177 153,178 180,162 C218,105 278,165 334,93 C348,80 359,62 370,51" fill="none"/>
