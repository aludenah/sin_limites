<svg xmlns="http://www.w3.org/2000/svg" width="750" height="350" viewBox="0 0 750 350" role="img" aria-labelledby="title desc">
<title id="title">Área en la gráfica de intensidad frente al tiempo</title>
<desc id="desc">Gráfica I frente a t con el área A entre t1 y t2. El recuadro indica A igual al valor absoluto de Q. Redibujo lineal sobre fondo blanco, basado en la página 218 del PDF proporcionado.</desc>
<defs>
