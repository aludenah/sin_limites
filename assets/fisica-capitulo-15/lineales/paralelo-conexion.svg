<polyline points="176.0,281.0 292.0,281.0 296.3,270.0 304.9,292.0 313.5,270.0 322.1,292.0 330.7,270.0 339.3,292.0 347.9,270.0 356.5,292.0 365.1,270.0 373.7,292.0 378.0,281.0 494.0,281.0"/>
