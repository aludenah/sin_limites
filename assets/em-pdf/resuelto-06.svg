<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="title"><title id="title">Problema 6: dos tramos semiinfinitos unidos por una semicircunferencia de radio 10 centímetros con corriente 0,5 amperios</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#28556c"/></marker></defs><rect width="100%" height="100%" rx="16" fill="white"/><g font-family="Arial,sans-serif" font-size="21" fill="#1b2f49" stroke-linecap="round" stroke-linejoin="round"><path d="M90 100L400 100" fill="none" stroke="#28556c" stroke-width="3"/><path d="M400 100A130 130 0 0 1 400 360" stroke="#28556c" stroke-width="4" fill="none"/><path d="M400 360L90 360" fill="none" stroke="#28556c" stroke-width="3"/><path d="M210 100L310 100" fill="none" stroke="#28556c" stroke-width="3" marker-end="url(#arrow)"/><path d="M310 360L210 360" fill="none" stroke="#28556c" stroke-width="3" marker-end="url(#arrow)"/><path d="M400 100L400 360" fill="none" stroke="#28556c" stroke-width="3" stroke-dasharray="7 7"/><path d="M400 230L508 302" fill="none" stroke="#28556c" stroke-width="3" stroke-dasharray="7 7"/><text x="380" y="238" font-size="21" text-anchor="middle" fill="#1b2f49">O</text><text x="455" y="292" font-size="20" text-anchor="middle" fill="#1b2f49">R</text><text x="595" y="180" font-size="21" text-anchor="middle" fill="#1b2f49">I = 0,5 A</text><text x="595" y="215" font-size="21" text-anchor="middle" fill="#1b2f49">R = 10 cm</text><text x="400" y="82" font-size="18" text-anchor="middle" fill="#1b2f49">A</text><text x="400" y="387" font-size="18" text-anchor="middle" fill="#1b2f49">B</text></g></svg>