<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="title"><title id="title">Propiedades del material: polos opuestos se atraen, polos semejantes se repelen y cada fragmento conserva ambos polos</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#28556c"/></marker></defs><rect width="100%" height="100%" rx="16" fill="white"/><g font-family="Arial,sans-serif" font-size="21" fill="#1b2f49" stroke-linecap="round" stroke-linejoin="round"><rect x="75" y="65" width="230" height="55" fill="#f6edf0" stroke="#28556c" stroke-width="2"/><rect x="455" y="65" width="230" height="55" fill="#edf5f8" stroke="#28556c" stroke-width="2"/><text x="125" y="100" font-size="21" text-anchor="middle" fill="#1b2f49">N</text><text x="250" y="100" font-size="21" text-anchor="middle" fill="#1b2f49">S</text><text x="505" y="100" font-size="21" text-anchor="middle" fill="#1b2f49">N</text><text x="630" y="100" font-size="21" text-anchor="middle" fill="#1b2f49">S</text><path d="M315 93L370 93" fill="none" stroke="#28556c" stroke-width="3" marker-end="url(#arrow)"/><path d="M445 93L390 93" fill="none" stroke="#28556c" stroke-width="3" marker-end="url(#arrow)"/><text x="380" y="47" font-size="21" text-anchor="middle" fill="#1b2f49">Polos opuestos: atracción</text><rect x="75" y="210" width="230" height="55" fill="#f6edf0" stroke="#28556c" stroke-width="2"/><rect x="455" y="210" width="230" height="55" fill="#edf5f8" stroke="#28556c" stroke-width="2"/><text x="125" y="245" font-size="21" text-anchor="middle" fill="#1b2f49">N</text><text x="250" y="245" font-size="21" text-anchor="middle" fill="#1b2f49">S</text><text x="505" y="245" font-size="21" text-anchor="middle" fill="#1b2f49">S</text><text x="630" y="245" font-size="21" text-anchor="middle" fill="#1b2f49">N</text><path d="M370 238L315 238" fill="none" stroke="#28556c" stroke-width="3" marker-end="url(#arrow)"/><path d="M390 238L445 238" fill="none" stroke="#28556c" stroke-width="3" marker-end="url(#arrow)"/><text x="380" y="187" font-size="21" text-anchor="middle" fill="#1b2f49">Polos semejantes: repulsión</text><text x="380" y="345" font-size="21" text-anchor="middle" fill="#1b2f49">Al dividir un imán, cada fragmento conserva N y S.</text></g></svg>