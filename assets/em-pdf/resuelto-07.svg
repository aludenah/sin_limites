<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="title"><title id="title">Problema 7: hilo largo y barra MN paralela, corrientes de 1 amperio hacia arriba, separación de 10 centímetros y barra de 1 metro</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#28556c"/></marker></defs><rect width="100%" height="100%" rx="16" fill="white"/><g font-family="Arial,sans-serif" font-size="21" fill="#1b2f49" stroke-linecap="round" stroke-linejoin="round"><path d="M250 65L250 330" fill="none" stroke="#28556c" stroke-width="7"/><path d="M490 100L490 300" fill="none" stroke="#28556c" stroke-width="9"/><path d="M215 220L215 135" fill="none" stroke="#28556c" stroke-width="3" marker-end="url(#arrow)"/><path d="M525 230L525 155" fill="none" stroke="#28556c" stroke-width="3" marker-end="url(#arrow)"/><text x="190" y="170" font-size="18" text-anchor="end" fill="#1b2f49">I = 1 A</text><text x="550" y="160" font-size="18" text-anchor="start" fill="#1b2f49">I = 1 A</text><text x="490" y="75" font-size="21" text-anchor="middle" fill="#1b2f49">M</text><text x="490" y="332" font-size="21" text-anchor="middle" fill="#1b2f49">N</text><path d="M250 360L490 360" fill="none" stroke="#28556c" stroke-width="3" stroke-dasharray="7 7"/><text x="370" y="387" font-size="21" text-anchor="middle" fill="#1b2f49">10 cm</text><text x="620" y="245" font-size="20" text-anchor="middle" fill="#1b2f49">MN = 1 m</text></g></svg>