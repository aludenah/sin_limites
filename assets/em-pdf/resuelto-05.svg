<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="title"><title id="title">Problema 5: espira rectangular de 4 por 6 centímetros en campo de 5 militeslas, con 37 grados respecto al plano</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#28556c"/></marker></defs><rect width="100%" height="100%" rx="16" fill="white"/><g font-family="Arial,sans-serif" font-size="21" fill="#1b2f49" stroke-linecap="round" stroke-linejoin="round"><path d="M210 300L350 105L640 105L500 300Z" stroke="#28556c" stroke-width="3" fill="#f2f7fb"/><path d="M270 225L130 120" fill="none" stroke="#28556c" stroke-width="3" marker-end="url(#arrow)"/><path d="M430 195L290 90" fill="none" stroke="#28556c" stroke-width="3" marker-end="url(#arrow)"/><path d="M590 165L450 60" fill="none" stroke="#28556c" stroke-width="3" marker-end="url(#arrow)"/><text x="140" y="98" font-size="21" text-anchor="middle" fill="#1b2f49">B = 5 mT</text><path d="M350 135L430 195" fill="none" stroke="#28556c" stroke-width="3" stroke-dasharray="7 7"/><path d="M430 195L325 195" fill="none" stroke="#28556c" stroke-width="3" stroke-dasharray="7 7"/><text x="373" y="185" font-size="18" text-anchor="middle" fill="#1b2f49">37°</text><text x="190" y="323" font-size="21" text-anchor="middle" fill="#1b2f49">M</text><text x="342" y="88" font-size="21" text-anchor="middle" fill="#1b2f49">L</text><text x="658" y="106" font-size="21" text-anchor="middle" fill="#1b2f49">R</text><text x="510" y="326" font-size="21" text-anchor="middle" fill="#1b2f49">N</text><text x="500" y="355" font-size="21" text-anchor="middle" fill="#1b2f49">MN = 4 cm</text><text x="630" y="235" font-size="18" text-anchor="middle" fill="#1b2f49">NR = 6 cm</text></g></svg>