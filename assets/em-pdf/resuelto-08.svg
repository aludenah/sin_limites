<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="title"><title id="title">Problema 8: flujo por espira aumenta linealmente de 2 a 6 webers entre 0 y 4 segundos, N igual a 40</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#28556c"/></marker></defs><rect width="100%" height="100%" rx="16" fill="white"/><g font-family="Arial,sans-serif" font-size="21" fill="#1b2f49" stroke-linecap="round" stroke-linejoin="round"><path d="M185 330L610 330" fill="none" stroke="#28556c" stroke-width="3" marker-end="url(#arrow)"/><path d="M185 330L185 55" fill="none" stroke="#28556c" stroke-width="3" marker-end="url(#arrow)"/><path d="M185 260L545 75" fill="none" stroke="#28556c" stroke-width="3"/><path d="M185 100L500 100" fill="none" stroke="#28556c" stroke-width="3" stroke-dasharray="7 7"/><path d="M500 100L500 330" fill="none" stroke="#28556c" stroke-width="3" stroke-dasharray="7 7"/><text x="160" y="108" font-size="21" text-anchor="middle" fill="#1b2f49">6</text><text x="160" y="267" font-size="21" text-anchor="middle" fill="#1b2f49">2</text><text x="500" y="360" font-size="21" text-anchor="middle" fill="#1b2f49">4</text><text x="185" y="37" font-size="21" text-anchor="middle" fill="#1b2f49">Φ (Wb)</text><text x="635" y="340" font-size="21" text-anchor="middle" fill="#1b2f49">t (s)</text><text x="530" y="40" font-size="20" text-anchor="middle" fill="#1b2f49">N = 40 espiras</text></g></svg>