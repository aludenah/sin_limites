<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="title"><title id="title">Ejemplo del material: hilo largo con corriente de 10 amperios y punto P a 5 centímetros sobre segmento que forma 53 grados con el hilo</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#28556c"/></marker></defs><rect width="100%" height="100%" rx="16" fill="white"/><g font-family="Arial,sans-serif" font-size="21" fill="#1b2f49" stroke-linecap="round" stroke-linejoin="round"><path d="M260 65L260 345" fill="none" stroke="#28556c" stroke-width="7"/><path d="M220 245L220 140" fill="none" stroke="#28556c" stroke-width="3" marker-end="url(#arrow)"/><text x="170" y="180" font-size="20" text-anchor="middle" fill="#1b2f49">I = 10 A</text><path d="M260 320L535 115" fill="none" stroke="#28556c" stroke-width="3" stroke-dasharray="7 7"/><path d="M260 115L535 115" fill="none" stroke="#28556c" stroke-width="3" stroke-dasharray="7 7"/><text x="550" y="98" font-size="25" text-anchor="middle" fill="#1b2f49">P</text><text x="410" y="245" font-size="21" text-anchor="middle" fill="#1b2f49">5 cm</text><text x="298" y="263" font-size="21" text-anchor="middle" fill="#1b2f49">53°</text><text x="395" y="92" font-size="21" text-anchor="middle" fill="#1b2f49">d</text><path d="M260 115h20v20h-20" stroke="#28556c" fill="none" stroke-width="2"/></g></svg>