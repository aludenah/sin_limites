<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="title"><title id="title">Líneas de campo cerradas de un imán, salientes de N y entrantes en S por el exterior</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#28556c"/></marker></defs><rect width="100%" height="100%" rx="16" fill="white"/><g font-family="Arial,sans-serif" font-size="21" fill="#1b2f49" stroke-linecap="round" stroke-linejoin="round"><rect x="250" y="170" width="260" height="65" rx="5" fill="#f4f7fb" stroke="#28556c" stroke-width="3"/><text x="305" y="212" font-size="28" text-anchor="middle" fill="#1b2f49">N</text><text x="455" y="212" font-size="28" text-anchor="middle" fill="#1b2f49">S</text><path d="M275 170C75 40 685 40 485 170" stroke="#28556c" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M275 170C110 35 650 35 485 170" stroke="#28556c" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M275 170C145 30 615 30 485 170" stroke="#28556c" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M275 235C75 365 685 365 485 235" stroke="#28556c" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M275 235C110 370 650 370 485 235" stroke="#28556c" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M275 235C145 375 615 375 485 235" stroke="#28556c" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M445 202L330 202" fill="none" stroke="#28556c" stroke-width="3" marker-end="url(#arrow)"/><text x="380" y="30" font-size="21" text-anchor="middle" fill="#1b2f49">Exterior: N → S</text><text x="380" y="387" font-size="19" text-anchor="middle" fill="#1b2f49">Los lazos se cierran dentro del imán: S → N</text></g></svg>