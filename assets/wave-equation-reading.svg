86 L262.00 -29.991 L264.00 -26.901 L266.00 -23.726 L268.00 -20.477 L270.00 -17.164 L272.00 -13.796 L274.00 -10.385 L276.00 -6.942 L278.00 -3.476 L280.00 -0.000 L282.00 3.476 L284.00 6.942 L286.00 10.385 L288.00 13.796 L290.00 17.164 L292.00 20.477 L294.00 23.726 L296.00 26.901 L298.00 29.991 L300.00 32.986 L302.00 35.878 L304.00 38.656 L306.00 41.313"/>
  </defs>
  <style>
    text{font-family:Inter,Arial,sans-serif;fill:#25444f}
    .panel-title{font-size:30px;font-weight:500;letter-spacing:.1px}
    .condition{font-family:Georgia,serif;font-style:italic;font-size:26px;fill:#6a8084}
    .dimension{font-size:26px;font-weight:500;fill:#3b6671}
    .axis-label{font-size:24px;font-weight:400;fill:#637c81}
    .symbol{font-family:Georgia,serif;font-style:italic}
    .formula{font-family:Georgia,serif;font-size:27px;font-style:italic;fill:#254d5b}
    .legend{font-size:21px;font-weight:400;fill:#75898c}
    @media(max-width:600px){.panel-title{font-size:32px}.dimension{font-size:29px}.axis-label{font-size:26px}.formula{font-size:29px}}
  </style>
  <rect width="900" height="530" fill="#fbfcfa"/>
  <path d="M450 36V477" fill="none" stroke="#e3e9e5" stroke-width="1"/>
  <text class="panel-title" x="232" y="63" text-anchor="middle">Tiempo fijo</text>
  <text class="condition" x="232" y="103" text-anchor="middle">t = 0</text>
  <text class="panel-title" x="668" y="63" text-anchor="middle">Posición fija</text>
  <text class="condition" x="668" y="103" text-anchor="middle">x = 0</text>
  <!-- Both curves use y=A cos(2πu/224), with u=0 at the first crest. -->
  <g transform="translate(108 300)">
    <path d="M0 84V-94" fill="none" stroke="#bdcbc9" stroke-width="1.1" marker-end="url(#we-axis)"/>
    <path d="M0 0H322" fill="none" stroke="#a8b8b5" stroke-width="1.2" stroke-dasharray="4 6" marker-end="url(#we-axis)"/>
    <text class="axis-label symbol" x="-13" y="-103" text-anchor="middle">y</text>
    <text class="axis-label" x="-10" y="25" text-anchor="end">0</text>
    <path d="M0 -117H224" fill="none" stroke="#597b83" stroke-width="1.5" marker-start="url(#we-dimension)" marker-end="url(#we-dimension)"/>
    <path d="M0 -124V-110M224 -110V-68" fill="none" stroke="#bdceca" stroke-width="1.1" stroke-dasharray="3 5"/>
    <text class="dimension" x="112" y="-143" text-anchor="middle">Longitud de onda <tspan class="symbol">λ</tspan></text>
    <path d="M-21 -62V0" fill="none" stroke="#a67636" stroke-width="1.6" marker-start="url(#we-amplitude)" marker-end="url(#we-amplitude)"/>
    <text class="dimension symbol" x="-38" y="-24" text-anchor="middle" style="fill:#9b733b">A</text>
    <use href="#we-cosine" fill="none" stroke="#276c73" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="0" cy="-62" r="4.3" fill="#fbfcfa" stroke="#276c73" stroke-width="1.7"/>
    <circle cx="224" cy="-62" r="4.3" fill="#fbfcfa" stroke="#276c73" stroke-width="1.7"/>
    <text class="axis-label" x="157" y="116" text-anchor="middle">Posición <tspan class="symbol">x</tspan></text>
  </g>
  <g transform="translate(544 300)">
    <path d="M0 84V-94" fill="none" stroke="#bdcbc9" stroke-width="1.1" marker-end="url(#we-axis)"/>
    <path d="M0 0H322" fill="none" stroke="#a8b8b5" stroke-width="1.2" stroke-dasharray="4 6" marker-end="url(#we-axis)"/>
    <text class="axis-label symbol" x="-13" y="-103" text-anchor="middle">y</text>
    <text class="axis-label" x="-10" y="25" text-anchor="end">0</text>
    <path d="M0 -117H224" fill="none" stroke="#597b83" stroke-width="1.5" marker-start="url(#we-dimension)" marker-end="url(#we-dimension)"/>
    <path d="M0 -124V-110M224 -110V-68" fill="none" stroke="#bdceca" stroke-width="1.1" stroke-dasharray="3 5"/>
    <text class="dimension" x="112" y="-143" text-anchor="middle">Período <tspan class="symbol">T</tspan></text>
    <path d="M-21 -62V0" fill="none" stroke="#a67636" stroke-width="1.6" marker-start="url(#we-amplitude)" marker-end="url(#we-amplitude)"/>
    <text class="dimension symbol" x="-38" y="-24" text-anchor="middle" style="fill:#9b733b">A</text>
    <use href="#we-cosine" fill="none" stroke="#314f68" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="0" cy="-62" r="4.3" fill="#fbfcfa" stroke="#314f68" stroke-width="1.7"/>
    <circle cx="224" cy="-62" r="4.3" fill="#fbfcfa" stroke="#314f68" stroke-width="1.7"/>
    <text class="axis-label" x="157" y="116" text-anchor="middle">Tiempo <tspan class="symbol">t</tspan></text>
  </g>
  <text class="formula" x="232" y="471" text-anchor="middle">y(x, 0) = A <tspan font-style="normal">cos</tspan>(kx)</text>
  <text class="formula" x="668" y="471" text-anchor="middle">y(0, t) = A <tspan font-style="normal">cos</tspan>(ωt)</text>
  <text class="legend" x="450" y="510" text-anchor="middle"><tspan class="symbol">y</tspan>: desplazamiento respecto al equilibrio</text>
</svg>
