<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" width="900" height="530" role="img" aria-labelledby="wave-equation-title wave-equation-desc">
  <title id="wave-equation-title">Cómo leer la ecuación de onda</title>
  <desc id="wave-equation-desc">Dos lecturas de una onda armónica con fase inicial cero. A la izquierda se fija el tiempo en cero y se representa el desplazamiento y frente a la posición x: la distancia horizontal entre crestas consecutivas es la longitud de onda lambda. A la derecha se fija la posición x en cero y se representa el desplazamiento y frente al tiempo t: el intervalo entre dos máximos consecutivos es el período T. En ambos perfiles, la amplitud A se mide desde el equilibrio hasta un máximo.</desc>
  <defs>
    <marker id="we-axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#9eaeae" stroke-width="1.5"/></marker>
    <marker id="we-dimension" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#597b83" stroke-width="1.5"/></marker>
    <marker id="we-amplitude" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#a67636" stroke-width="1.5"/></marker>
