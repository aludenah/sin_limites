<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-labelledby="title desc"><title id="title">La distancia por eco se obtiene del recorrido de ida y vuelta</title><desc id="desc">Un emisor y receptor situados juntos envían sonido hacia un objeto reflector. La flecha superior indica ida y la inferior vuelta. Cada trayecto tiene distancia d. El recorrido completo es2d y el intervalo entre emitir y recibir es delta t; por ello d igual a v delta t dividido entre2.</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#fdfefb"/><stop offset="1" stop-color="#edf4ee"/></linearGradient><radialGradient id="particle" cx=".28" cy=".22"><stop stop-color="#e4fbff"/><stop offset=".4" stop-color="#5daac0"/><stop offset="1" stop-color="#286b83"/></radialGradient><radialGradient id="source" cx=".25" cy=".2"><stop stop-color="#fff5c9"/><stop offset=".4" stop-color="#e0b556"/><stop offset="1" stop-color="#9a7436"/></radialGradient><linearGradient id="metal"><stop stop-color="#537079"/><stop offset=".25" stop-color="#c9dadb"/><stop offset=".6" stop-color="#869fa4"/><stop offset="1" stop-color="#405b65"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#347e7b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrowgold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#9d7836" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><style>text{font-family:Inter,Arial,sans-serif;fill:#294e57;text-anchor:middle}.main{font-size:36px;font-weight:650}.sub{font-size:32px}.small{font-size:30px}.teal{fill:#267b7c}.gold{fill:#936c2c}</style><rect width="600" height="600" fill="url(#bg)"/><text class="sub" x="153" y="49">Emisor y</text><text class="sub" x="153" y="88">receptor</text><text class="sub" x="497" y="88">Objeto</text><rect x="491" y="115" width="43" height="300" rx="5" fill="#d5ddd8" stroke="#9eafa4" stroke-width="2"/><path d="M501 124L526 137" fill="none" stroke="#b3c0b6" stroke-width="2"/><path d="M501 148L526 161" fill="none" stroke="#b3c0b6" stroke-width="2"/><path d="M501 172L526 185" fill="none" stroke="#b3c0b6" stroke-width="2"/><path d="M501 196L526 209" fill="none" stroke="#b3c0b6" stroke-width="2"/><path d="M501 220L526 233" fill="none" stroke="#b3c0b6" stroke-width="2"/><path d="M501 244L526 257" fill="none" stroke="#b3c0b6" stroke-width="2"/><path d="M501 268L526 281" fill="none" stroke="#b3c0b6" stroke-width="2"/><path d="M501 292L526 305" fill="none" stroke="#b3c0b6" stroke-width="2"/><path d="M501 316L526 329" fill="none" stroke="#b3c0b6" stroke-width="2"/><path d="M501 340L526 353" fill="none" stroke="#b3c0b6" stroke-width="2"/><path d="M501 364L526 377" fill="none" stroke="#b3c0b6" stroke-width="2"/><path d="M501 388L526 401" fill="none" stroke="#b3c0b6" stroke-width="2"/><rect x="45" y="216" width="46" height="108" rx="9" fill="url(#metal)" stroke="#6c8790" stroke-width="2"/><path d="M91 227L137 205V335L91 313Z" fill="#78999f" stroke="#bed1ce" stroke-width="2"/><ellipse cx="137" cy="270" rx="14" ry="65" fill="#2d4d58" stroke="#9db7b8" stroke-width="3"/><ellipse cx="139" cy="270" rx="7" ry="26" fill="#739b9f"/><path d="M157 200H484" fill="none" stroke="#347e7b" stroke-width="3" marker-end="url(#arrow)"/><text class="main teal" x="319" y="178">Ida</text><path d="M484 340H157" fill="none" stroke="#9d7836" stroke-width="3" marker-end="url(#arrowgold)"/><text class="main gold" x="319" y="382">Vuelta</text><path d="M150 421V466M491 421V466" fill="none" stroke="#9cb2a9" stroke-width="1.5"/><path d="M153 445H488" fill="none" stroke="#347e7b" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text class="main" x="320" y="434">d</text><text class="sub" x="300" y="518">Recorrido total: 2d</text><text x="300" y="573" font-size="40" fill="#267b7c" font-family="Georgia,serif">d = vΔt / 2</text></svg>