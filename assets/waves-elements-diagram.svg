<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="wave-elements-svg-title wave-elements-svg-desc">
  <title id="wave-elements-svg-title">Elementos de una onda</title>
  <desc id="wave-elements-svg-desc">Instantánea del perfil de una onda transversal. Las crestas están por encima del equilibrio y el valle o depresión está por debajo. La amplitud A se mide verticalmente desde el equilibrio hasta una cresta. La longitud de onda lambda une dos crestas consecutivas. La línea horizontal discontinua representa la posición de equilibrio.</desc>
