  <style>
    text{font-family:Inter,Arial,sans-serif;fill:#25444f}
    .wave-label{font-size:28px;font-weight:500;letter-spacing:.1px}
    .wave-symbol{font-family:Georgia,serif;font-style:italic;font-size:30px}
    .wave-axis{font-size:20px;font-weight:400;fill:#829397}
    .wave-equilibrium{font-size:25px;font-weight:400;fill:#6b8287}
    @media(max-width:600px){.wave-label{font-size:32px}.wave-equilibrium{font-size:28px}}
  </style>
  <rect width="900" height="470" fill="#fbfcfa"/>
  <!-- Consecutive crests: x=250 and x=610, so lambda=360. -->
  <path d="M250 104V164M610 104V164" fill="none" stroke="#c0cdcc" stroke-width="1.1" stroke-dasharray="3 5"/>
  <path d="M250 89H610" fill="none" stroke="#597b83" stroke-width="1.5" marker-start="url(#wave-elements-dimension)" marker-end="url(#wave-elements-dimension)"/>
  <text class="wave-label" x="430" y="61" text-anchor="middle">Longitud de onda <tspan class="wave-symbol">λ</tspan></text>
  <!-- The vertical coordinate is displacement; the horizontal coordinate is position. -->
  <path d="M86 359V140" fill="none" stroke="#c6d1ce" stroke-width="1.1"/>
  <path d="M86 252H847" fill="none" stroke="#9aacac" stroke-width="1.3" stroke-dasharray="5 7"/>
  <path d="M86 172H244M86 332H423" fill="none" stroke="#e0e7e3" stroke-width="1"/>
  <text class="wave-axis" x="83" y="124" text-anchor="middle" style="font-style:italic">y</text>
  <text class="wave-axis" x="852" y="259" style="font-style:italic">x</text>
  <text class="wave-axis" x="66" y="179" text-anchor="end">+A</text>
  <text class="wave-axis" x="66" y="339" text-anchor="end">−A</text>
  <text class="wave-axis" x="66" y="259" text-anchor="end">0</text>
  <!-- A single slender profile keeps the measurements visually distinct. -->
  <use href="#wave-elements-profile" fill="none" stroke="url(#wave-elements-line)" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
  <use href="#wave-elements-profile" fill="none" stroke="#d9eae3" stroke-width="1" stroke-linecap="round" opacity=".55" transform="translate(0 -1.2)"/>
  <!-- Amplitude is measured from equilibrium to the crest, never crest to valley. -->
  <path d="M250 172V252" fill="none" stroke="#a67636" stroke-width="1.7" marker-start="url(#wave-elements-amplitude)" marker-end="url(#wave-elements-amplitude)"/>
  <path d="M241 172H259M241 252H259" fill="none" stroke="#a67636" stroke-width="1.1"/>
  <text class="wave-label" x="250" y="296" text-anchor="middle" style="fill:#91652f">Amplitud <tspan class="wave-symbol">A</tspan></text>
  <circle cx="610" cy="172" r="4.5" fill="#fbfcfa" stroke="#267376" stroke-width="1.7"/>
  <path d="M618 166L650 137" fill="none" stroke="#7e9b9e" stroke-width="1.2"/>
  <text class="wave-label" x="663" y="135">Cresta</text>
  <circle cx="430" cy="332" r="4.5" fill="#fbfcfa" stroke="#267376" stroke-width="1.7"/>
  <path d="M430 341V364" fill="none" stroke="#7e9b9e" stroke-width="1.2"/>
  <text class="wave-label" x="430" y="401" text-anchor="middle">Valle <tspan style="font-weight:400">(depresión)</tspan></text>
  <path d="M252 443H304" fill="none" stroke="#9aacac" stroke-width="1.3" stroke-dasharray="5 7"/>
  <text class="wave-equilibrium" x="325" y="452">Posición de equilibrio</text>
</svg>
