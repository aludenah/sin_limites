<text x="74" y="74" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#587081">SIN LÍMITES  /  CÍVICA  /  05</text>
<text x="74" y="149" font-family="DejaVu Sans,Arial,sans-serif" font-size="54" font-weight="800" text-anchor="start" fill="#102d48">Estado, nación y gobierno</text>
<text x="74" y="260" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#587081">Tres conceptos relacionados que no son equivalentes.</text>
<rect x="74" y="350" width="412" height="530" rx="22" fill="#ffffff" stroke="#d9e3e9" stroke-width="2"/>
<rect x="74" y="350" width="412" height="9" rx="0" fill="#0a7376" stroke="#0a7376" stroke-width="2"/>
<text x="102" y="409" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="800" text-anchor="start" fill="#0a7376">01</text>
<text x="102" y="457" font-family="DejaVu Sans,Arial,sans-serif" font-size="33" font-weight="800" text-anchor="start" fill="#0a7376">Estado</text>
<text x="102" y="515" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#203a4e">Organización jurídica</text>
<text x="102" y="554" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#203a4e">y política con</text>
<text x="102" y="593" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#203a4e">continuidad.</text>
<rect x="518" y="350" width="412" height="530" rx="22" fill="#ffffff" stroke="#d9e3e9" stroke-width="2"/>
<rect x="518" y="350" width="412" height="9" rx="0" fill="#2b67a3" stroke="#2b67a3" stroke-width="2"/>
<text x="546" y="409" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="800" text-anchor="start" fill="#2b67a3">02</text>
<text x="546" y="457" font-family="DejaVu Sans,Arial,sans-serif" font-size="33" font-weight="800" text-anchor="start" fill="#2b67a3">Nación</text>
<text x="546" y="515" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#203a4e">Vínculos históricos,</text>
<text x="546" y="554" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#203a4e">culturales y de</text>
<text x="546" y="593" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#203a4e">pertenencia.</text>
<rect x="962" y="350" width="412" height="530" rx="22" fill="#ffffff" stroke="#d9e3e9" stroke-width="2"/>
<rect x="962" y="350" width="412" height="9" rx="0" fill="#a76812" stroke="#a76812" stroke-width="2"/>
<text x="990" y="409" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="800" text-anchor="start" fill="#a76812">03</text>
<text x="990" y="457" font-family="DejaVu Sans,Arial,sans-serif" font-size="33" font-weight="800" text-anchor="start" fill="#a76812">Gobierno</text>
<text x="990" y="515" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#203a4e">Autoridades que</text>
<text x="990" y="554" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#203a4e">dirigen durante un</text>
<text x="990" y="593" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#203a4e">periodo.</text>
<line x1="74" y1="968" x2="1374" y2="968" stroke="#c6d6df" stroke-width="2"/>
<text x="74" y="1010" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#587081">Cambiar de autoridades no extingue por sí solo al Estado ni sus obligaciones.</text>
