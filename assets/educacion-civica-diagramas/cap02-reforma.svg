<svg xmlns="http://www.w3.org/2000/svg" width="1448" height="1086" viewBox="0 0 1448 1086" role="img"><title>Dos vías para la reforma</title><desc>Artículo 206 según la Ley 31988.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10" fill="#587081"/></marker></defs>
<rect width="1448" height="1086" fill="#f4f7f9"/><rect width="1448" height="14" fill="#ba3e45"/>
<text x="74" y="74" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#587081">SIN LÍMITES  /  CÍVICA  /  02</text>
<text x="74" y="149" font-family="DejaVu Sans,Arial,sans-serif" font-size="54" font-weight="800" text-anchor="start" fill="#102d48">Dos vías para la reforma</text>
<text x="74" y="260" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#587081">Artículo 206 según la Ley 31988.</text>
<rect x="74" y="330" width="622" height="565" rx="22" fill="#ffffff" stroke="#d9e3e9" stroke-width="2"/>
<rect x="74" y="330" width="622" height="9" rx="0" fill="#0a7376" stroke="#0a7376" stroke-width="2"/>
<text x="102" y="389" font-family="DejaVu Sans,Arial,sans-serif" font-size="33" font-weight="800" text-anchor="start" fill="#0a7376">Con referéndum</text>
<text x="102" y="447" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#203a4e">Mayoría absoluta del número legal en</text>
<text x="102" y="486" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#203a4e">cada cámara.</text>
<text x="102" y="525" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#203a4e">Después: ratificación mediante</text>
<text x="102" y="564" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#203a4e">referéndum.</text>
<rect x="752" y="330" width="622" height="565" rx="22" fill="#ffffff" stroke="#d9e3e9" stroke-width="2"/>
<rect x="752" y="330" width="622" height="9" rx="0" fill="#2b67a3" stroke="#2b67a3" stroke-width="2"/>
<text x="780" y="389" font-family="DejaVu Sans,Arial,sans-serif" font-size="33" font-weight="800" text-anchor="start" fill="#2b67a3">Sin referéndum</text>
<text x="780" y="447" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#203a4e">Más de dos tercios en cada cámara.</text>
<text x="780" y="486" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#203a4e">En dos legislaturas ordinarias</text>
<text x="780" y="525" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#203a4e">sucesivas, en cada ocasión.</text>
<line x1="74" y1="968" x2="1374" y2="968" stroke="#c6d6df" stroke-width="2"/>
<text x="74" y="1010" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#587081">La ley de reforma constitucional no puede ser observada por el presidente.</text>
</svg>