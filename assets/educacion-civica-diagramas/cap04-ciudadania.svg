<rect x="74" y="350" width="412" height="9" rx="0" fill="#0a7376" stroke="#0a7376" stroke-width="2"/>
<text x="102" y="409" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="800" text-anchor="start" fill="#0a7376">01</text>
<text x="102" y="457" font-family="DejaVu Sans,Arial,sans-serif" font-size="33" font-weight="800" text-anchor="start" fill="#0a7376">Nacionalidad</text>
<text x="102" y="515" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#203a4e">Vínculo jurídico con</text>
<text x="102" y="554" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#203a4e">el Estado.</text>
<rect x="518" y="350" width="412" height="530" rx="22" fill="#ffffff" stroke="#d9e3e9" stroke-width="2"/>
<rect x="518" y="350" width="412" height="9" rx="0" fill="#2b67a3" stroke="#2b67a3" stroke-width="2"/>
<text x="546" y="409" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="800" text-anchor="start" fill="#2b67a3">02</text>
<text x="546" y="457" font-family="DejaVu Sans,Arial,sans-serif" font-size="33" font-weight="800" text-anchor="start" fill="#2b67a3">Derechos humanos</text>
<text x="546" y="515" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#203a4e">Corresponden a todas</text>
<text x="546" y="554" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#203a4e">las personas.</text>
<rect x="962" y="350" width="412" height="530" rx="22" fill="#ffffff" stroke="#d9e3e9" stroke-width="2"/>
<rect x="962" y="350" width="412" height="9" rx="0" fill="#a76812" stroke="#a76812" stroke-width="2"/>
<text x="990" y="409" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="800" text-anchor="start" fill="#a76812">03</text>
<text x="990" y="457" font-family="DejaVu Sans,Arial,sans-serif" font-size="33" font-weight="800" text-anchor="start" fill="#a76812">Ciudadanía</text>
<text x="990" y="499" font-family="DejaVu Sans,Arial,sans-serif" font-size="33" font-weight="800" text-anchor="start" fill="#a76812">electoral</text>
<text x="990" y="557" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#203a4e">Tiene requisitos de</text>
<text x="990" y="596" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#203a4e">edad e inscripción.</text>
<line x1="74" y1="968" x2="1374" y2="968" stroke="#c6d6df" stroke-width="2"/>
<text x="74" y="1010" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#587081">Los menores participan socialmente y tienen derechos, aunque todavía no voten.</text>
